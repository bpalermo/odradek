name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml for a version tag: the same jobs, with the version as
  # the image tag instead of `dev`, and the version written into the build.
  workflow_call:
    inputs:
      tag:
        description: the mutable tag of the images; `dev` when this is not a release
        type: string
        default: dev
      version:
        description: the release version (X.Y.Z); empty when this is not a release
        type: string
        default: ""

permissions:
  contents: read
  # Exchanged with Fulcio for a short-lived signing certificate. Keyless: there
  # is no private key to store or rotate.
  id-token: write

# Keyed by branch, so publications are serialized: the `dev` tag is mutable,
# and two runs publishing at once could leave it on the older commit. GitHub
# keeps one pending run per group, so a commit pushed while another is queued
# may publish nothing; the commit that superseded it publishes right after.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# WHERE the image goes is one setting, bazel/registry.bzl. Bazel loads it and
# this workflow reads it; the registry is not spelled out here.
#
# Credentials are a Quay robot account, secrets QUAY_USERNAME / QUAY_TOKEN. The
# robot can write the repository and cannot create it: it exists already.
#
# Third-party actions are pinned to commit SHAs. This job holds the registry
# credential and `id-token: write`, so an action swapped underneath a mutable
# tag could push and sign an image with this repository's own identity.
jobs:
  publish:
    # workflow_dispatch can target any branch. Without this guard a manual run
    # from a feature branch would publish under the same mutable tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    env:
      # `inputs` is empty for a push to main, which publishes `dev`.
      IMAGE_TAG: ${{ inputs.tag || 'dev' }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Bazel executes build tooling from the dependency graph; do not
          # leave GITHUB_TOKEN in .git/config while it runs.
          persist-credentials: false

      - name: Set the release version
        if: inputs.version != ''
        run: scripts/set-version.sh "${RELEASE_VERSION}"

      # Re-running an old run checks that old commit out again and would move
      # the mutable `dev` tag backwards. Publishing is only correct for main's
      # current tip. ls-remote needs no token on a public repository.
      - name: Refuse to publish a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::could not read main's tip" >&2
            exit 1
          fi
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${GITHUB_SHA}: main is now ${tip}" >&2
            exit 1
          fi
          echo "publishing ${GITHUB_SHA}, which is main's tip"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Read the registry setting
        run: |
          set -euo pipefail
          setting() { sed -nE "s/^$1 = \"([^\"]+)\"$/\1/p" bazel/registry.bzl; }
          registry="$(setting IMAGE_REGISTRY)"
          namespace="$(setting IMAGE_NAMESPACE)"
          if [ -z "${registry}" ] || [ -z "${namespace}" ]; then
            echo "::error::could not read IMAGE_REGISTRY / IMAGE_NAMESPACE from bazel/registry.bzl" >&2
            exit 1
          fi
          {
            echo "IMAGE_REGISTRY_HOST=${registry}"
            echo "ODRADEK_IMAGE=${registry}/${namespace}/odradek"
          } >> "${GITHUB_ENV}"

      # Everything is built before any credential exists on the runner. The
      # `bazel run` steps below then only execute what this step produced.
      # cosign is part of that: the release binary pinned by the
      # rules_img_signer_cosign bazel_dep (//bazel/cosign).
      # The index digest is in an output group of its own, not in the default
      # outputs, so it is asked for by name; the digest step below reads it.
      - name: Build the image and the tools
        run: |
          bazel build --config=ci --output_groups=+digest \
            "--//server:image_tag=${IMAGE_TAG}" \
            //server:image_index //server:image_push \
            //bazel/cosign //bazel/cosign:verify_image

      # One login covers the push and cosign: both read the Docker config this
      # writes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push the multi-arch image
        run: bazel run --config=ci "--//server:image_tag=${IMAGE_TAG}" //server:image_push

      # The digest comes from the build rather than from the registry:
      # re-resolving a mutable tag reintroduces a time-of-check window. The
      # digest file sits beside the index manifest and comes from the same
      # rule, so one path is derived from the other.
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          index_file="$(bazel cquery --config=ci "--//server:image_tag=${IMAGE_TAG}" \
            //server:image_index --output=files 2>/dev/null \
            | grep -E '_index\.json$' | head -1)"
          digest_file="${index_file%_index.json}_digest"
          if [ -z "${index_file}" ] || [ ! -s "${digest_file}" ]; then
            echo "::error::could not find the image index digest produced by the build" >&2
            exit 1
          fi
          digest="$(cat "${digest_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
          esac
          echo "image=${ODRADEK_IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${ODRADEK_IMAGE}@${digest}"

      # --recursive signs the index and every child manifest, so pulling the
      # amd64 or arm64 manifest by its own digest also gets something signed.
      #
      # An image keeps its digest for as long as its content does, so this
      # commit may have pushed exactly what an earlier one signed. Ask the
      # verifier first: it exits 0 for "signed", 1 for "not signed, or not all
      # of it" and 2 for "could not check". Only 1 is a reason to sign; a
      # registry that did not answer says nothing about the signatures.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
          IMAGE_REF: ${{ steps.digest.outputs.image }}
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          rc=0
          bazel run --config=ci //bazel/cosign:verify_image -- "${IMAGE_REF}" >presign.log 2>&1 || rc=$?
          case "${rc}" in
            0)
              echo "${IMAGE_REF} is already signed by this workflow: an earlier commit published the same image"
              exit 0
              ;;
            1) ;;
            *)
              cat presign.log
              echo "::error::could not check whether ${IMAGE_REF} is already signed (exit ${rc})" >&2
              exit 1
              ;;
          esac
          bazel run --config=ci //bazel/cosign -- sign --recursive "${IMAGE_REF}"

      # `cosign verify` has no --recursive, so the verifier walks the index's
      # children itself. This one counts.
      - name: Verify the signatures
        env:
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: bazel run --config=ci //bazel/cosign:verify_image -- "${{ steps.digest.outputs.image }}"

  # The native image of the server (ADR 5), published under the same repository
  # with a -native suffix on the tag. GraalVM does not cross-compile, so each
  # architecture is built and pushed on a machine of that architecture (one leg
  # of the matrix each), and the multi-arch index is assembled below from the two
  # pushed manifests.
  native:
    name: native (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    # It pushes and does not sign: no id-token here.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # The mutable tag. The same value as the default of the string_flag
      # //server:image_tag, which names the JVM image's tag.
      IMAGE_TAG: ${{ inputs.tag || 'dev' }}
      RELEASE_VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
    # Each leg of the matrix sets the output named after its architecture.
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set the release version
        if: inputs.version != ''
        run: scripts/set-version.sh "${RELEASE_VERSION}"

      - name: Refuse to publish a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ] || [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${GITHUB_SHA}: main is ${tip:-unreadable}" >&2
            exit 1
          fi

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.arch }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # native-image links with gcc and the static zlib.
      - name: Toolchain for native-image
        run: dpkg -s gcc zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc zlib1g-dev; }

      - name: Read the registry setting
        run: |
          set -euo pipefail
          setting() { sed -nE "s/^$1 = \"([^\"]+)\"$/\1/p" bazel/registry.bzl; }
          registry="$(setting IMAGE_REGISTRY)"
          if [ -z "${registry}" ]; then
            echo "::error::could not read IMAGE_REGISTRY from bazel/registry.bzl" >&2
            exit 1
          fi
          echo "IMAGE_REGISTRY_HOST=${registry}" >> "${GITHUB_ENV}"

      # Built before any credential exists on the runner.
      - name: Build the image
        run: |
          bazel build --config=ci --output_groups=+digest \
            --//server:image_tag="${IMAGE_TAG}" \
            //server:image_native_manifest //server:image_native_push

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Pushes <tag>-<commit>-native-<arch>: one tag, immutable because it names
      # the commit.
      - name: Push the image
        run: bazel run --config=ci --//server:image_tag="${IMAGE_TAG}" //server:image_native_push

      # From the build, not from the registry, as for the JVM image.
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          manifest_file="$(bazel cquery --config=ci //server:image_native_manifest --output=files 2>/dev/null \
            | grep -E '_manifest_manifest\.json$' | head -1)"
          digest_file="${manifest_file%_manifest.json}_digest"
          if [ -z "${manifest_file}" ] || [ ! -s "${digest_file}" ]; then
            echo "::error::could not find the manifest digest produced by the build" >&2
            exit 1
          fi
          digest="$(cat "${digest_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
          esac
          echo "${ARCH}=${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${ARCH} ${digest}"

  native-index:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: native
    environment: release
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.tag || 'dev' }}
      AMD64_DIGEST: ${{ needs.native.outputs.amd64 }}
      ARM64_DIGEST: ${{ needs.native.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Refuse to publish a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ] || [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${GITHUB_SHA}: main is ${tip:-unreadable}" >&2
            exit 1
          fi

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Read the registry setting
        run: |
          set -euo pipefail
          setting() { sed -nE "s/^$1 = \"([^\"]+)\"$/\1/p" bazel/registry.bzl; }
          registry="$(setting IMAGE_REGISTRY)"
          namespace="$(setting IMAGE_NAMESPACE)"
          if [ -z "${registry}" ] || [ -z "${namespace}" ]; then
            echo "::error::could not read IMAGE_REGISTRY / IMAGE_NAMESPACE from bazel/registry.bzl" >&2
            exit 1
          fi
          {
            echo "IMAGE_REGISTRY_HOST=${registry}"
            echo "ODRADEK_IMAGE=${registry}/${namespace}/odradek"
          } >> "${GITHUB_ENV}"

      - name: Build the signing tools
        run: bazel build --config=ci //bazel/cosign //bazel/cosign:verify_image

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # The index names the two manifests by digest, as the builds recorded them.
      # Its second tag is the commit's, like the JVM image's.
      - name: Assemble the multi-arch index
        id: index
        run: |
          set -euo pipefail
          for digest in "${AMD64_DIGEST}" "${ARM64_DIGEST}"; do
            case "${digest}" in
              sha256:*) ;;
              *) echo "::error::unexpected digest '${digest}'" >&2; exit 1 ;;
            esac
          done
          docker buildx imagetools create \
            --tag "${ODRADEK_IMAGE}:${IMAGE_TAG}-native" \
            --tag "${ODRADEK_IMAGE}:${IMAGE_TAG}-${GITHUB_SHA}-native" \
            "${ODRADEK_IMAGE}@${AMD64_DIGEST}" "${ODRADEK_IMAGE}@${ARM64_DIGEST}"
          digest="$(docker buildx imagetools inspect "${ODRADEK_IMAGE}:${IMAGE_TAG}-${GITHUB_SHA}-native" \
            --format '{{.Manifest.Digest}}')"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected index digest '${digest}'" >&2; exit 1 ;;
          esac
          echo "image=${ODRADEK_IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "assembled ${ODRADEK_IMAGE}@${digest}"

      # As for the JVM image: --recursive signs the index and both manifests, and
      # an index that is already signed is left alone.
      - name: Sign the index
        env:
          COSIGN_YES: "true"
          IMAGE_REF: ${{ steps.index.outputs.image }}
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          rc=0
          bazel run --config=ci //bazel/cosign:verify_image -- "${IMAGE_REF}" >presign.log 2>&1 || rc=$?
          case "${rc}" in
            0)
              echo "${IMAGE_REF} is already signed by this workflow"
              exit 0
              ;;
            1) ;;
            *)
              cat presign.log
              echo "::error::could not check whether ${IMAGE_REF} is already signed (exit ${rc})" >&2
              exit 1
              ;;
          esac
          bazel run --config=ci //bazel/cosign -- sign --recursive "${IMAGE_REF}"

      - name: Verify the signatures
        env:
          REGISTRY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_TOKEN }}
          REGISTRY_CREDENTIAL_HOST: ${{ env.IMAGE_REGISTRY_HOST }}
        run: bazel run --config=ci //bazel/cosign:verify_image -- "${{ steps.index.outputs.image }}"
