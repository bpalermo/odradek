name: publish-native

# One architecture of the native image (ADR 5), built and pushed on a machine of
# that architecture: GraalVM does not cross-compile. Called once per
# architecture by publish.yml, which then assembles the multi-arch index from
# the digests this returns.

on:
  workflow_call:
    inputs:
      arch:
        description: amd64 or arm64, as the tag suffix
        required: true
        type: string
      runner:
        description: a runner of that architecture
        required: true
        type: string
      tag:
        description: the mutable tag of the image; the string_flag //server:image_tag
        required: true
        type: string
    outputs:
      digest:
        description: digest of the pushed single-architecture manifest
        value: ${{ jobs.push.outputs.digest }}

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs, as in publish.yml: this job holds
# the registry credential.
jobs:
  push:
    environment: release
    runs-on: ${{ inputs.runner }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # See publish.yml: only main's current tip is published.
      - name: Refuse to publish a commit that is no longer main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ] || [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${GITHUB_SHA}: main is ${tip:-unreadable}" >&2
            exit 1
          fi

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ inputs.arch }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # native-image links with gcc and the static zlib.
      - name: Toolchain for native-image
        run: dpkg -s gcc zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc zlib1g-dev; }

      - name: Read the registry setting
        run: |
          set -euo pipefail
          setting() { sed -nE "s/^$1 = \"([^\"]+)\"$/\1/p" bazel/registry.bzl; }
          registry="$(setting IMAGE_REGISTRY)"
          if [ -z "${registry}" ]; then
            echo "::error::could not read IMAGE_REGISTRY from bazel/registry.bzl" >&2
            exit 1
          fi
          echo "IMAGE_REGISTRY_HOST=${registry}" >> "${GITHUB_ENV}"

      # Built before any credential exists on the runner.
      - name: Build the image
        run: |
          bazel build --config=ci --output_groups=+digest \
            --//server:image_tag=${{ inputs.tag }} \
            //server:image_native_manifest //server:image_native_push

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Pushes <tag>-<commit>-native-<arch>: one tag, immutable because it names
      # the commit.
      - name: Push the image
        run: bazel run --config=ci --//server:image_tag=${{ inputs.tag }} //server:image_native_push

      # From the build, not from the registry, as in publish.yml.
      - name: Record the pushed digest
        id: digest
        run: |
          set -euo pipefail
          manifest_file="$(bazel cquery --config=ci //server:image_native_manifest --output=files 2>/dev/null \
            | grep -E '_manifest_manifest\.json$' | head -1)"
          digest_file="${manifest_file%_manifest.json}_digest"
          if [ -z "${manifest_file}" ] || [ ! -s "${digest_file}" ]; then
            echo "::error::could not find the manifest digest produced by the build" >&2
            exit 1
          fi
          digest="$(cat "${digest_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${{ inputs.arch }} ${digest}"
