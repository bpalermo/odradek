name: release

# A version tag releases everything under one number (ADR 4): the server image
# (JVM and native) and the e2e-client image, and, where a registry has been set
# up, the Java artifacts and the Clojure and Python clients.
#
#   git tag v1.2.3 <main's tip> && git push origin v1.2.3
#
# The tag must point at main's tip: the jobs reused from publish.yml refuse any
# other commit. Nothing is committed: the version is written into the checkout
# of each job (scripts/set-version.sh) and main stays at 0.0.0-dev.
#
# The image jobs are publish.yml's, unchanged, so a release is pushed and signed
# exactly as every commit on main is. The three library jobs are off until
# their repository variable says the registry is ready; see each job.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Also proves the script accepts it, before any job publishes.
          scripts/set-version.sh "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Refuse a tag that is not main's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ] || [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, but main is ${tip:-unreadable}" >&2
            exit 1
          fi

  # Build, test and lint the tagged commit with the release version in place,
  # before anything is pushed anywhere.
  verify:
    needs: plan
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ci-build
          repository-cache: true
          cache-save: false
      - run: bazel build //... --config=ci
      - run: bazel test //... --config=ci

  images:
    needs: [plan, verify]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.plan.outputs.version }}
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  # io.github.bpalermo:odradek-client and :odradek-extension.
  #
  # Off until the repository variable PUBLISH_MAVEN is `true`. NOT VALIDATED:
  # it has never run. It needs, in the `release` environment: MAVEN_USER and
  # MAVEN_PASSWORD (a Central Portal token); GPG_PRIVATE_KEY (the secret key
  # ring, `gpg --export-secret-keys`, base64-encoded) and GPG_PASSPHRASE; and
  # the io.github.bpalermo namespace verified on Maven Central. Signing is in
  # memory (USE_IN_MEMORY_PGP_KEYS): the publisher's gpg mode never passes a
  # passphrase, so it cannot use a protected key on a runner. The signing-check
  # workflow tests those two secrets without publishing.
  #
  # The upload goes to the Portal's staging-compatible endpoint. A deployment
  # made there reaches the Portal only when this job asks for it (one request
  # covers both artifacts), and with publishing_type=automatic the Portal
  # publishes it once it validates. The job then follows the deployment until
  # it is published, so a validation that fails fails the release. A version
  # on Central cannot be removed or replaced, and the Portal goes on publishing
  # after the hand-off whether or not this job is still following: if the job
  # fails after it, check the Portal's deployments for the version before
  # running it again. The images are already pushed by
  # then (ADR 4), so a failure here leaves a release without its Java
  # artifacts.
  maven:
    if: vars.PUBLISH_MAVEN == 'true'
    needs: [plan, images]
    environment: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      STAGING: https://ossrh-staging-api.central.sonatype.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-maven
          repository-cache: true
          cache-save: false
      # Built before any credential exists on the runner, as `bazel run` builds
      # them: the scripts it writes are what the upload runs, so nothing is built
      # while the secrets are in the environment.
      - run: |
          set -euo pipefail
          bazel run --config=ci --script_path=publish-extension.sh //extension/java:maven.publish
          bazel run --config=ci --script_path=publish-client.sh //client/java:maven.publish
      - name: Upload
        env:
          MAVEN_REPO: ${{ env.STAGING }}/service/local/staging/deploy/maven2/
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          # Not GPG_SIGN: the publisher refuses both modes at once.
          USE_IN_MEMORY_PGP_KEYS: "true"
          PGP_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PGP_SIGNING_PWD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ./publish-extension.sh
          ./publish-client.sh
      # The staging API keeps an upload under the token, the namespace and the
      # runner's address, so this runs in the same job as the upload. The code is
      # kafka-spiffe's release step, with both artifacts' purls.
      - name: Hand the deployment to the Portal, and follow it until published
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          PORTAL: https://central.sonatype.com
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "${MAVEN_USER}" "${MAVEN_PASSWORD}" | base64 -w0)"
          # GitHub masks the secrets, not their encodings.
          echo "::add-mask::${token}"
          auth="Authorization: Bearer ${token}"
          purls="$(jq -cn --arg v "${RELEASE_VERSION}" \
            '["odradek-extension", "odradek-client"] | map("pkg:maven/io.github.bpalermo/\(.)@\($v)")')"
          # Once the hand-off is asked for, the Portal may publish whatever this
          # step does next: every failure after it says so.
          check="Check ${PORTAL}/publishing/deployments for ${RELEASE_VERSION} before running this job again: the Portal may still publish it, and a version on Central cannot be published twice."
          # The namespace's Portal deployments, as the staging API knows them.
          deployments() {
            curl --fail-with-body -sS -H "${auth}" \
              "${STAGING}/manual/search/repositories?ip=any&profile_id=io.github.bpalermo" |
              jq -r '.repositories[].portal_deployment_id // empty'
          }
          status() {
            curl --fail-with-body -sS -X POST -H "${auth}" "${PORTAL}/api/v1/publisher/status?id=$1"
          }
          # A deployment ID is a UUID; anything else in an answer is ignored.
          valid() {
            [[ "$1" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          }

          # Those of earlier attempts, so that a release run again follows its own.
          for attempt in 1 2 3 4 5; do
            before="$(deployments)" && break
            if [ "${attempt}" = 5 ]; then
              echo "::error::the staging API's deployments could not be read; nothing was handed to the Portal" >&2
              exit 1
            fi
            sleep 10
          done
          if ! curl --fail-with-body -sS -X POST -H "${auth}" \
            "${STAGING}/manual/upload/defaultRepository/io.github.bpalermo?publishing_type=automatic"; then
            echo "::error::the hand-off request failed. ${check}" >&2
            exit 1
          fi
          echo

          # The deployment the hand-off made: the one new ID, followed whatever its
          # state, so that one failing validation still shows the Portal's errors.
          # Only if several are new are the purls asked for, to tell which is ours.
          # A read that fails (a 429, a 5xx, a reset connection) is tried again: the
          # Portal goes on publishing whether or not this job is watching.
          deployment=""
          new=()
          for _ in $(seq 1 30); do
            new=()
            for id in $(deployments || true); do
              if valid "${id}" && ! grep -qxF -e "${id}" <<<"${before}"; then
                new+=("${id}")
              fi
            done
            if [ "${#new[@]}" -eq 1 ]; then
              deployment="${new[0]}"
            else
              for id in "${new[@]}"; do
                if (status "${id}" || true) | jq -e --argjson want "${purls}" \
                  '(.purls // []) as $have | all($want[]; . as $p | $have | index($p))' >/dev/null 2>&1; then
                  deployment="${id}"
                fi
              done
            fi
            [ -n "${deployment}" ] && break
            sleep 10
          done
          if [ -z "${deployment}" ]; then
            for id in "${new[@]}"; do
              echo "new deployment ${id}: $( (status "${id}" || true) | jq -c '{deploymentState, purls, errors}' 2>/dev/null || echo unreadable)"
            done
            echo "::error::no new Portal deployment could be told to be this release's (${#new[@]} new). ${check}" >&2
            exit 1
          fi
          echo "Portal deployment ${deployment}"

          # Publishing takes minutes, sometimes tens of them.
          for _ in $(seq 1 120); do
            if ! answer="$(status "${deployment}")"; then
              echo "$(date -u +%H:%M:%S) status not read; trying again"
              sleep 30
              continue
            fi
            # A 2xx that is not JSON (a proxy's or a maintenance page) is read again.
            state="$(jq -r .deploymentState <<<"${answer}" 2>/dev/null)" || state=unreadable
            echo "$(date -u +%H:%M:%S) ${state}"
            case "${state}" in
              PUBLISHED)
                if ! jq -e --argjson want "${purls}" \
                  '(.purls // []) as $have | all($want[]; . as $p | $have | index($p))' <<<"${answer}" >/dev/null; then
                  echo "::error::deployment ${deployment} was published, but not as ${purls}: $(jq -c '.purls' <<<"${answer}")" >&2
                  exit 1
                fi
                echo "odradek-extension and odradek-client ${RELEASE_VERSION} are published to Maven Central."
                exit 0
                ;;
              FAILED)
                echo "::error::the Portal refused deployment ${deployment}: $(jq -c '.errors // {}' <<<"${answer}")" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::deployment ${deployment} was not published within an hour. ${check}" >&2
          exit 1

  # com.github.bpalermo/odradek-clj.
  #
  # Off until the repository variable PUBLISH_CLOJARS is `true`. NOT VALIDATED:
  # it has never run. It needs CLOJARS_USERNAME and CLOJARS_PASSWORD (a deploy
  # token) in the `release` environment. The jar depends on
  # io.github.bpalermo:odradek-client, so it is usable only once `maven` has
  # published that.
  clojars:
    if: vars.PUBLISH_CLOJARS == 'true'
    needs: [plan, images]
    environment: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-clojars
          repository-cache: true
          cache-save: false
      - run: bazel build --config=ci //client/clojure:clojars.publish
      - name: Upload
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: bazel run --config=ci //client/clojure:clojars.publish

  # The `odradek` wheel.
  #
  # Off until the repository variable PUBLISH_PYPI is `true`. NOT VALIDATED: it
  # has never run. It uses PyPI trusted publishing, so it needs no secret, but
  # the `odradek` project on PyPI must name this repository, this workflow file
  # and the `release` environment as a trusted publisher.
  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: [plan, images]
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-pypi
          repository-cache: true
          cache-save: false
      - name: Build the wheel
        run: |
          set -euo pipefail
          bazel build --config=ci //client/python:wheel
          mkdir dist
          cp "$(bazel cquery --config=ci //client/python:wheel --output=files 2>/dev/null | grep '\.whl$')" dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # The GitHub release, once the images exist. Its notes are generated from the
  # pull requests merged since the previous tag.
  github-release:
    needs: [plan, images]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --notes "Images: \`quay.io/odradek/odradek:${VERSION}\` (JVM) and \`quay.io/odradek/odradek:${VERSION}-native\`, for linux/amd64 and linux/arm64, signed with cosign."
