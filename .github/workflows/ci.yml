name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not tags; the version each SHA
# corresponds to is in the comment beside it. Dependabot keeps them current.
#
# Caches: every job RESTORES the Bazel caches, but only runs on main SAVE them
# (cache-save below), so only reviewed code populates a cache that a later
# trusted build consumes. Gated on the ref rather than the event, because
# workflow_dispatch can target any branch.
jobs:
  # Build, unit tests, formatting and lint. Proto lint and the proto
  # breaking-change check are ordinary test targets, so `bazel test //...`
  # covers them; there is no separate proto job.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version is pinned here: bazelisk reads .bazelversion, so the
      # checkout is the single source of the Bazel version.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # --config=ci refuses lockfile drift and fails on lint violations.
      - name: bazel build //...
        run: bazel build //... --config=ci

      - name: bazel test //...
        run: bazel test //... --config=ci

      - name: Sources are formatted
        run: bazel run --config=ci //:format.check

  # The container image, built for both architectures but not pushed, then
  # loaded and started. A change that breaks the image fails here on the pull
  # request instead of in publish.yml after the merge.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Everything publish.yml runs, so it cannot be the first place these
      # targets are built.
      - name: Build the image, the push target and the signing tools
        run: |
          bazel build --config=ci \
            //server:image_index //server:image_push \
            //e2e-client:image_index //e2e-client:image_push \
            //bazel/cosign //bazel/cosign:verify_image

      # The image must do what the binary does: read a configuration from the
      # mounted volume, listen on the socket, and stop cleanly on SIGTERM. The
      # socket directory is a tmpfs because the image runs as nonroot.
      - name: Load the image, start it and stop it
        run: |
          set -euo pipefail
          bazel run --config=ci //server:image_load
          mkdir smoke && cp server/testdata/minimal.yaml smoke/odradek.yaml
          docker run -d --name odradek \
            -v "${PWD}/smoke:/etc/odradek:ro" \
            --tmpfs /var/run/kafka:mode=1777 \
            localhost/odradek:e2e
          for _ in $(seq 1 30); do
            if docker logs odradek 2>&1 | grep -q "listening on /var/run/kafka/kafka.sock"; then
              break
            fi
            sleep 1
          done
          docker stop --time 20 odradek
          docker logs odradek 2>&1 | tee image-run.log
          grep -q "listening on /var/run/kafka/kafka.sock" image-run.log
          grep -q "stopped" image-run.log

      # The e2e-client image (quay.io/odradek/e2e-client) starts, serves its
      # results and writes its final line when stopped. No sidecar is needed
      # for that: the client retries a socket that is not there.
      - name: Load the e2e-client image, start it and stop it
        run: |
          set -euo pipefail
          bazel run --config=ci //e2e-client:image_load
          docker run --rm localhost/odradek-e2e-client:e2e --help | grep -q -- "--fail-hold"
          docker run -d --name e2e-client -p 18080:8080 localhost/odradek-e2e-client:e2e \
            --mode consumer --topic smoke --stop-timeout 5s
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:18080/results | tee results.json
          grep -q '"mode":"consumer"' results.json
          docker stop --timeout 20 e2e-client
          docker logs e2e-client 2>/dev/null | tee e2e-client-run.log
          grep -q '"event":"final"' e2e-client-run.log

  # End to end against real Kafka in KRaft mode (no ZooKeeper). Two
  # independent single-node clusters, so the multi-cluster cases run in the
  # same suite. After `build`, so a change that does not compile or fails its
  # unit tests never gets as far as starting brokers.
  e2e:
    name: e2e (kafka kraft)
    needs: [build]
    runs-on: ubuntu-latest
    services:
      # Each broker is a combined broker+controller node. The listener port
      # inside the container equals the published one, because the advertised
      # listener is what a client is told to reconnect to.
      kafka-a:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
      kafka-b:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9093:9093
        env:
          KAFKA_NODE_ID: 2
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9093,CONTROLLER://:19093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 2@localhost:19093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
    env:
      ODRADEK_E2E_KAFKA_A: localhost:9092
      ODRADEK_E2E_KAFKA_B: localhost:9093
      # The third broker, started by a step below: it needs certificates that
      # do not exist before the job runs, which a service container cannot wait for.
      ODRADEK_E2E_KAFKA_TLS: localhost:9094
      ODRADEK_E2E_KAFKA_TLS_ADMIN: localhost:9095
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-e2e
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # A broker that only accepts mutual TLS, with certificates made here.
      - name: Start the mutual TLS broker
        env:
          ODRADEK_BAZEL_FLAGS: --config=ci
        run: |
          e2e/tls/broker.sh "${RUNNER_TEMP}/odradek-e2e-tls"
          echo "ODRADEK_E2E_TLS_DIR=${RUNNER_TEMP}/odradek-e2e-tls" >> "${GITHUB_ENV}"

      # The suite is tagged e2e and excluded from `bazel test //...`;
      # --config=e2e selects it, forwards the two addresses above and never
      # caches a result.
      - name: bazel test //e2e/...
        run: bazel test //e2e/... --config=ci --config=e2e

  # The GraalVM native image of the server (ADR 5), on a machine of each
  # architecture because native-image does not cross-compile: build it, check
  # how it treats configurations, run the end-to-end suite against it, and start
  # the image. Excluded from `bazel build //...` (tag manual) so that the jobs
  # above need no native-image toolchain. After `build`, like e2e.
  native:
    name: native (${{ matrix.arch }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      # Each broker is a combined broker+controller node. The listener port
      # inside the container equals the published one, because the advertised
      # listener is what a client is told to reconnect to.
      kafka-a:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
      kafka-b:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9093:9093
        env:
          KAFKA_NODE_ID: 2
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9093,CONTROLLER://:19093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 2@localhost:19093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
    env:
      ODRADEK_E2E_KAFKA_A: localhost:9092
      ODRADEK_E2E_KAFKA_B: localhost:9093
      # The third broker, started by a step below: it needs certificates that
      # do not exist before the job runs, which a service container cannot wait for.
      ODRADEK_E2E_KAFKA_TLS: localhost:9094
      ODRADEK_E2E_KAFKA_TLS_ADMIN: localhost:9095
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-native-${{ matrix.arch }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # A broker that only accepts mutual TLS, with certificates made here.
      - name: Start the mutual TLS broker
        env:
          ODRADEK_BAZEL_FLAGS: --config=ci
        run: |
          e2e/tls/broker.sh "${RUNNER_TEMP}/odradek-e2e-tls"
          echo "ODRADEK_E2E_TLS_DIR=${RUNNER_TEMP}/odradek-e2e-tls" >> "${GITHUB_ENV}"

      # native-image links with gcc and the static zlib; the hosted images
      # have both, this only makes sure.
      - name: Toolchain for native-image
        run: dpkg -s gcc zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc zlib1g-dev; }

      # Everything publish.yml's native jobs build, so they cannot be the first
      # place these targets are built.
      - name: Build the native image and its push target
        run: |
          bazel build --config=ci \
            //server:server_native //server:image_native_manifest //server:image_native_push

      # No broker needed: starts, stops on SIGTERM, accepts Kafka's codecs and
      # rejects a class the image does not contain.
      - name: bazel test //server:native_config_test
        run: bazel test --config=ci //server:native_config_test

      - name: bazel test //e2e:e2e_native_binary_test
        run: bazel test --config=ci --config=e2e //e2e:e2e_native_binary_test

      # Same as the JVM image's smoke test: the image reads its configuration
      # from the mounted volume, listens on the socket and stops on SIGTERM.
      - name: Load the image, start it and stop it
        run: |
          set -euo pipefail
          bazel run --config=ci //server:image_native_load
          mkdir smoke && cp server/testdata/minimal.yaml smoke/odradek.yaml
          docker run -d --name odradek \
            -v "${PWD}/smoke:/etc/odradek:ro" \
            --tmpfs /var/run/kafka:mode=1777 \
            localhost/odradek:e2e-native
          for _ in $(seq 1 30); do
            if docker logs odradek 2>&1 | grep -q "listening on /var/run/kafka/kafka.sock"; then
              break
            fi
            sleep 1
          done
          docker stop --time 20 odradek
          docker logs odradek 2>&1 | tee image-run.log
          grep -q "listening on /var/run/kafka/kafka.sock" image-run.log
          grep -q "stopped" image-run.log

  # The single check the main ruleset requires, and the only reason this job
  # exists.
  #
  # A required status check is matched by check-run name, so requiring the
  # jobs themselves ties the ruleset to their names: rename or split one and
  # the required check can never report again, which blocks every pull request
  # instead of failing it. Requiring one aggregate leaves the jobs free to
  # change.
  #
  # if: always() so it runs even when a job fails; a skipped job reports
  # nothing, and a required check that never reports blocks the pull request.
  ci:
    name: ci
    needs: [build, image, e2e, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Reads the results rather than naming the jobs, so adding a job to
      # `needs` above is enough to have it gate merges.
      - name: every job this depends on must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job reported '${result}'" >&2
              exit 1
            fi
          done
