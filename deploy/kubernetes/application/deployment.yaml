# An application that consumes through the dispatcher: its pods are not members
# of any consumer group, so it can be scaled, by hand or by an autoscaler, and
# rolled as often as it likes without a rebalance, and to more pods than its
# topics have partitions. `billing` and its image stand for your application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
    spec:
      # The identity the dispatcher's policy names:
      # spiffe://example.org/ns/billing/sa/billing.
      serviceAccountName: billing
      # The app's drain, then the sidecar's: on SIGTERM the sidecar passes on
      # the acknowledgements the app has sent, closes its streams to the
      # dispatcher in good order and waits up to 5 s for it to close them. What
      # the app still held is delivered to other pods, without using an attempt.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        # The sidecar runs as 65532 and makes its socket rw for owner and group
        # only: this puts the app's processes in that group.
        supplementalGroups: [65532]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A native sidecar: started before the app and stopped after it. The
        # app container starts once the startup probe has passed, which does
        # not wait for the dispatcher: an app's Consume stream opens at once
        # and receives nothing until the dispatcher is reached.
        - name: odradek
          # See ../dispatcher/deployment.yaml about the tag.
          image: quay.io/odradek/odradek:dev
          restartPolicy: Always
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
          ports:
            - name: health
              containerPort: 9464
              protocol: TCP
          startupProbe:
            grpc:
              port: 9464
              service: ""
            periodSeconds: 1
            failureThreshold: 120
          readinessProbe:
            grpc:
              port: 9464
              service: ""
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9464
              service: liveness
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/odradek
              readOnly: true
            - name: kafka-socket
              mountPath: /var/run/kafka
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: billing
          # A placeholder: your application, built on an Odradek client library.
          image: registry.example.org/billing:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The app talks to the sidecar over this socket and sees neither
            # Kafka nor the dispatcher, nor any credential of either.
            - name: kafka-socket
              mountPath: /var/run/kafka
      volumes:
        - name: config
          configMap:
            name: billing-odradek
        - name: kafka-socket
          emptyDir:
            medium: Memory
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
