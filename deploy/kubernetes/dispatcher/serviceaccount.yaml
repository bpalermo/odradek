# The dispatcher's identity. With SPIRE its SPIFFE ID follows from it, as
# spiffe://<trust domain>/ns/<namespace>/sa/odradek-dispatcher in the usual
# registration: the ID sidecars accept (`dispatcher.tls.acceptedSpiffeIds`),
# and the principal the brokers' ACLs name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odradek-dispatcher
  labels:
    app.kubernetes.io/name: odradek-dispatcher
    app.kubernetes.io/part-of: odradek
automountServiceAccountToken: false
