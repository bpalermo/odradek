edition = "2024";

// The protocol between a sidecar and a dispatcher.
//
// A dispatcher is an Odradek server deployed on its own, whose replicas are
// the members of a consumer group. It hands the records it consumes to the
// sidecars of the application's pods, which are not group members. This
// protocol carries what a sidecar wants to consume, the records, their
// acknowledgements, flow control and the list of dispatcher replicas. Both
// ends are the Odradek server; an application never speaks it.
package odradek.delivery.v1;

import "odradek/kafka/v1/odradek.proto";

option java_outer_classname = "DeliveryProto";
option java_package = "io.github.bpalermo.odradek.delivery.v1";

// DeliveryService is served by a dispatcher on a TCP port. Sidecars are its
// clients: a dispatcher never opens a connection to a sidecar.
service DeliveryService {
  // Deliver hands the records of one topic to one sidecar.
  //
  // One stream carries one topic of one consumer group. A sidecar opens a
  // stream to every dispatcher replica for each topic its application
  // consumes, because each replica owns some of the topic's partitions, and
  // closes them when the application stops consuming. A replica joins the
  // consumer group when the first sidecar declares it to that replica, which
  // is why the list of replicas a sidecar is sent is all of them.
  //
  // The first message from the sidecar must be Declare; the dispatcher
  // answers with Accepted before anything else. Records are then delivered
  // only against credits granted by the sidecar. A record stays with the
  // sidecar until it is acknowledged, rejected, returned or released, or until
  // the stream ends; a record that is unacknowledged when the stream ends, or
  // when its processing deadline passes, is delivered again, possibly to
  // another sidecar. Only the second counts as a failed attempt: see
  // Settings.max_attempts.
  //
  // A declaration is refused by ending the stream, before Accepted, with one
  // of these statuses:
  //
  //  - INVALID_ARGUMENT: the first message is not Declare, or the declaration
  //    is malformed (a required field is missing, or the settings contradict
  //    each other). Retrying unchanged fails again.
  //  - UNAUTHENTICATED: the sidecar presented no identity the dispatcher can
  //    check: its certificate carries no SPIFFE ID. Said before the first
  //    message is looked at. A sidecar with no certificate, or with one that
  //    does not verify, gets no status from the dispatcher at all: the TLS
  //    handshake fails, which gRPC reports to it as UNAVAILABLE.
  //  - PERMISSION_DENIED: the dispatcher's policy has no rule allowing this
  //    identity to consume this topic in this group on this cluster, or to
  //    use the dead-letter topic it names. A cluster the dispatcher does not
  //    have is refused the same way, so that a sidecar cannot probe for
  //    cluster names. Retrying unchanged fails until the policy changes.
  //  - FAILED_PRECONDITION: the group already consumes the topic with other
  //    settings, declared by a sidecar that is still connected. The status
  //    message says which settings are in force. The declaration is accepted
  //    once no sidecar of the group holds the topic with the old settings.
  //    Settings.max_processing_ms is never a reason: see Settings.
  //  - UNIMPLEMENTED: the declaration is well formed and asks for something
  //    this dispatcher cannot do: what a newer sidecar asks of an older
  //    dispatcher. Nothing is refused this way today. Retrying unchanged
  //    fails until the dispatcher is replaced.
  //  - UNAVAILABLE: the dispatcher is starting or stopping, or cannot reach
  //    the cluster; or it was not reached at all, a TLS handshake that either
  //    end refused included. Retry with backoff.
  //
  // After Accepted the stream ends with INVALID_ARGUMENT when the sidecar
  // breaks the protocol (a second Declare, for example), and with UNAVAILABLE
  // when the dispatcher stops. In both cases everything unacknowledged is
  // delivered again.
  rpc Deliver(stream DeliverRequest) returns (stream DeliverResponse);
}

// ---------------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------------

// PeerInfo identifies the Odradek server on the other end of a stream. It is
// informational: it is reported in logs and metrics and never changes
// behaviour.
message PeerInfo {
  // Version of the Odradek server.
  string version = 1;
}

// Ordering says which records of a topic may be in flight at the same time.
// A record is in flight from the moment it is sent to a sidecar until it is
// acknowledged, dead-lettered or given up for redelivery.
enum Ordering {
  // Not set; behaves as ORDERING_KEY.
  ORDERING_UNSPECIFIED = 0;
  // A record is sent only when no earlier record of its partition with the
  // same key is in flight. Records without a key are sent as under
  // ORDERING_NONE. Keys are compared as the bytes stored in Kafka.
  ORDERING_KEY = 1;
  // A record is sent only when no earlier record of its partition is in
  // flight: at most one record in flight per partition.
  ORDERING_PARTITION = 2;
  // A record is sent as soon as a sidecar has credit.
  ORDERING_NONE = 3;
}

// OffsetReset is the position used for a partition for which the group has
// no committed offset.
enum OffsetReset {
  // Not set; behaves as OFFSET_RESET_EARLIEST.
  OFFSET_RESET_UNSPECIFIED = 0;
  // Start at the oldest retained record.
  OFFSET_RESET_EARLIEST = 1;
  // Start at the end of the partition.
  OFFSET_RESET_LATEST = 2;
}

// OnExhausted says what happens to a record that has used all its attempts.
enum OnExhausted {
  // Not set; behaves as ON_EXHAUSTED_BLOCK.
  ON_EXHAUSTED_UNSPECIFIED = 0;
  // The record blocks its partition: it is not skipped, the commit position
  // stays below it, and no later record of the partition is delivered.
  ON_EXHAUSTED_BLOCK = 1;
  // The record is written to Settings.dead_letter_topic by the dispatcher,
  // as stored and with headers that say where it came from, and counts as
  // acknowledged once the brokers have acknowledged that write. Until then
  // the commit position stays below it.
  ON_EXHAUSTED_DEAD_LETTER = 2;
}

// Settings is how one consumer group consumes one topic. All sidecars of a
// group share them: the first declaration decides, and holds for as long as
// a sidecar of the group holds the topic.
//
// max_processing_ms is the exception. It comes from the application, not from
// the configuration of its server, and changes between versions of it, so it
// takes no part in the comparison of a declaration with the settings in
// force: the dispatcher uses the value of the most recent declaration it
// accepted for the group and topic, for the records it sends from then on. A
// record already sent keeps the deadline it was sent under.
message Settings {
  // Which records may be in flight at the same time. Unset behaves as
  // ORDERING_KEY.
  Ordering ordering = 1;
  // Longest a delivered record may stay unacknowledged, in milliseconds,
  // before the dispatcher counts the attempt as failed and delivers the
  // record again. Required and positive in a declaration: the sidecar sends
  // the deadline it resolved for its application's Consume stream. Not
  // compared with the settings in force; the latest declaration's value
  // applies (see Settings).
  uint32 max_processing_ms = 2;
  // Where to start a partition for which the group has no committed offset,
  // when start_timestamp_ms is unset or matches no record. Unset behaves as
  // OFFSET_RESET_EARLIEST.
  OffsetReset offset_reset = 3;
  // Where to start a partition for which the group has no committed offset:
  // at the first record whose timestamp, in milliseconds since the Unix
  // epoch, is at or after this instant. Takes precedence over offset_reset.
  // Unset means offset_reset alone decides.
  int64 start_timestamp_ms = 4;
  // How many times a record is delivered before it is exhausted. An attempt
  // fails when its processing deadline passes or when the sidecar rejects the
  // record. A stream that ends fails nothing: what it held is delivered again
  // without having used an attempt, because a sidecar going away says nothing
  // about the record, and rolling the application must not exhaust what
  // happened to be in flight. Unset or zero means there is no limit: the
  // record is delivered again until it is acknowledged, and on_exhausted
  // never applies. The count is the replica's own and starts again when the
  // partition changes owner (see Record.attempt), so the limit bounds the
  // attempts one owner makes, not those of the record's whole life.
  uint32 max_attempts = 5;
  // What happens to a record that has used max_attempts attempts. Unset
  // behaves as ON_EXHAUSTED_BLOCK.
  OnExhausted on_exhausted = 6;
  // Topic, on the same cluster, that exhausted records are written to. Set
  // exactly when on_exhausted is ON_EXHAUSTED_DEAD_LETTER.
  string dead_letter_topic = 7;
  // How long the dispatcher waits before it sends a record again after its
  // first failed attempt, in milliseconds. The wait doubles with each
  // further failed attempt at the same record, up to
  // redelivery_backoff_max_ms. While a record waits it is unacknowledged, so
  // it holds back what the ordering makes wait for it. Zero sends again at
  // once. A record sent again because its stream ended does not wait. Unset
  // asks for the dispatcher's default: 1000, or redelivery_backoff_max_ms
  // when that is set and less. Greater than redelivery_backoff_max_ms is
  // INVALID_ARGUMENT.
  uint32 redelivery_backoff_ms = 8;
  // The longest wait before a record is sent again, in milliseconds. Unset
  // asks for the dispatcher's default: 30000, or redelivery_backoff_ms when
  // that is set and more.
  uint32 redelivery_backoff_max_ms = 9;
}

// ---------------------------------------------------------------------------
// Sidecar to dispatcher
// ---------------------------------------------------------------------------

// DeliverRequest is a message from the sidecar on a Deliver stream.
message DeliverRequest {
  // Exactly one must be set.
  oneof msg {
    // Handshake. Must be the first message on the stream, and sent only once.
    Declare declare = 1;
    // Grants delivery credits.
    Credits credits = 2;
    // Marks records as processed.
    Ack ack = 3;
    // Returns one record the sidecar could not hand to its application.
    Reject reject = 4;
    // Gives back records the application has not taken, without using an
    // attempt. Only on a stream whose Accepted set accepts_return.
    Return returned = 5;
  }
}

// Declare is the Deliver handshake: what the sidecar wants to consume, as
// whom and how. The dispatcher consumes what its connected sidecars declare
// and nothing else, so the declaration is also what makes the dispatcher's
// replicas join the group and subscribe to the topic.
message Declare {
  // Name of the Kafka cluster to read from, as the dispatcher's
  // configuration names it. A declaration cannot describe a cluster:
  // addresses and credentials are the dispatcher's. Required.
  string cluster = 1;
  // Consumer group the dispatcher's replicas join for this topic. Required.
  string group_id = 2;
  // Topic to consume. Required.
  string topic = 3;
  // How the topic is to be consumed. An unset field asks for its default.
  // The dispatcher compares the result with the settings in force for this
  // group and topic, if any, and refuses a difference with
  // FAILED_PRECONDITION, except in max_processing_ms (see Settings).
  Settings settings = 4;
  // The sidecar sending this stream. Optional.
  PeerInfo sidecar = 5;
}

// Credits grants the dispatcher permission to deliver more records on this
// stream. Grants are additive. A sidecar grants only while its application
// has granted credits itself, and spreads them over the replicas it is
// connected to. A record that is released, or delivered again elsewhere,
// does not return its credit.
message Credits {
  // Number of additional records the dispatcher may deliver.
  uint32 records = 1;
}

// Ack marks records of one partition as processed: every record that was
// delivered on this stream, is still unacknowledged, and has an offset in
// the inclusive range [first_offset, last_offset].
//
// A sidecar receives only some of a partition's records, so the offsets it
// holds have gaps. The range may span them: offsets in it that this stream
// did not deliver are not affected, whoever holds them. Acks may arrive in
// any order; the dispatcher commits, per partition, the offset below which
// every record is acknowledged.
message Ack {
  // Partition of the acknowledged records.
  int32 partition = 1;
  // First offset of the range, inclusive.
  int64 first_offset = 2;
  // Last offset of the range, inclusive. Equal to first_offset for a single
  // record.
  int64 last_offset = 3;
}

// Reject returns one record that the sidecar could not decode with the
// topic's codec, so that it never reached the application. It counts as a
// failed attempt: the record is delivered again after the wait of
// Settings.redelivery_backoff_ms, or is exhausted. A sidecar rejects as soon
// as it knows: the wait is the dispatcher's. A reject for a record this
// stream does not hold is ignored.
message Reject {
  // Partition of the record.
  int32 partition = 1;
  // Offset of the record.
  int64 offset = 2;
  // Why the record was rejected, for the dispatcher's logs and, when the
  // record ends in a dead-letter topic after this attempt, for the header
  // that says why. Not stable; do not match on it.
  string reason = 3;
}

// Return gives back records of one partition that the sidecar holds and has
// not written to its application: they wait behind records the application
// has not finished, and would otherwise spend their processing deadline
// there (ADR 7). It is not a failed attempt. Each record is delivered again
// at once, under the same attempt number, to another sidecar when one has
// credit. The credit the records used is not given back.
//
// A sidecar returns what it holds unhanded when its application has held a
// record longer than its processing deadline, and any record that has waited
// for half of the deadline its batch was sent under. It never returns a record
// the application was given, and returns each delivery at most once.
//
// A return counts only for a record this stream holds in flight under the
// attempt it names: a record sent again to the same stream after a missed
// deadline carries the next attempt, so a late return of the earlier copy is
// told apart from it. A late return gives nothing back (that attempt has
// failed already) and only makes the dispatcher forget the expired copy this
// stream held. Sent only when the stream's Accepted set accepts_return.
message Return {
  // Partition of the records.
  int32 partition = 1;
  // The records, each as it was delivered on this stream.
  repeated ReturnedRecord records = 2;
}

// ReturnedRecord names one delivery given back.
message ReturnedRecord {
  // Offset of the record.
  int64 offset = 1;
  // The attempt number it was delivered with (Record.attempt).
  uint32 attempt = 2;
}

// ---------------------------------------------------------------------------
// Dispatcher to sidecar
// ---------------------------------------------------------------------------

// DeliverResponse is a message from the dispatcher on a Deliver stream.
message DeliverResponse {
  // Exactly one is set.
  oneof msg {
    // Handshake reply. Always the first message on the stream.
    Accepted accepted = 1;
    // The dispatcher's replicas changed.
    ReplicaList replicas = 2;
    // Records from one partition.
    RecordBatch records = 3;
    // The dispatcher no longer owns some partitions.
    Released released = 4;
  }
}

// Accepted completes the Deliver handshake.
message Accepted {
  // The settings in force for this group and topic, with every default
  // filled in: those of the first declaration, which this one matched or
  // was, with the max_processing_ms of this one.
  Settings settings = 1;
  // The dispatcher's replicas as this one knew them at the handshake: the
  // newest list it has. The sidecar opens a stream to each one it is not
  // connected to, unless it already acts on a list with a higher generation.
  ReplicaList replicas = 2;
  // The dispatcher replica answering this stream.
  PeerInfo dispatcher = 3;
  // Where the replica answering this stream serves DeliveryService, exactly
  // as it appears in `replicas`. A sidecar that reached the replica through
  // the address of the dispatcher's Service does not know which one answered:
  // this is how it learns which replica it already has a stream to. When it
  // is unset, or names a replica that is not listed, the sidecar opens a
  // stream to every listed replica and closes this one.
  string address = 4;
  // Whether this replica understands Return. A sidecar sends Return only on
  // a stream whose Accepted says so; to an older dispatcher it sends none,
  // and records wait for its application as before.
  bool accepts_return = 5;
}

// ReplicaList is every replica of the dispatcher, whatever each of them
// consumes: a replica starts consuming a group's topics when a sidecar
// declares them to it, so a sidecar declares to every replica there is. A
// list is complete: it replaces the one before it. Every replica pushes the
// new list on every stream it holds whenever a replica starts or stops, and a
// sidecar opens and closes streams to match.
//
// The replicas agree on the list through a consumer group of their own in
// Kafka, where the same message also serves as what they tell each other: a
// replica joins with a list of itself alone under the highest generation it
// has seen, and is answered with the list of all under a new one.
message ReplicaList {
  // Orders the lists of one dispatcher: every change of its replicas makes a
  // list with a higher generation than any replica had seen, and every
  // replica sends the same list under the same generation. A sidecar ignores
  // a list whose generation is not higher than that of the list it is acting
  // on. A sidecar that has lost every stream forgets the generation it knew
  // and starts again from the bootstrap address. Generations are not
  // consecutive, and the same replicas may be listed again under a higher
  // one.
  uint64 generation = 1;
  // The replicas, ordered by address. The order means nothing.
  repeated Replica replicas = 2;
}

// Replica is one dispatcher replica.
message Replica {
  // Where the replica serves DeliveryService, as host:port. It is an address
  // to connect to as given: the host is normally the replica's pod IP, and a
  // sidecar does not resolve it again later.
  string address = 1;
}

// RecordBatch carries records of one partition, in offset order. Each record
// consumes one credit. The offsets are not consecutive: the records between
// them went to other sidecars, or are held back by the ordering.
message RecordBatch {
  // Partition the records were read from.
  int32 partition = 1;
  // The records, in offset order.
  repeated Record records = 2;
  // The processing deadline the records were sent under, in milliseconds:
  // the dispatcher counts a failed attempt for each one not acknowledged
  // within it. Set by a dispatcher that sets Accepted.accepts_return; a
  // sidecar gives back a record that has waited half of it (see Return).
  uint32 max_processing_ms = 3;
}

// Record is one record as stored in Kafka. The dispatcher applies no codec:
// the sidecar decodes key and value, as it does when it consumes directly.
message Record {
  // Offset of the record in its partition.
  int64 offset = 1;
  // Record timestamp in milliseconds since the Unix epoch.
  int64 timestamp_ms = 2;
  // Record key, as stored. Unset is a null key.
  bytes key = 3;
  // Record value, as stored. Unset is a null value (a tombstone).
  bytes value = 4;
  // Record headers, as stored, in order.
  repeated odradek.kafka.v1.Header headers = 5;
  // Which attempt at this record this is for the replica sending it,
  // starting at 1: one more than the attempts of this replica that failed,
  // by a missed processing deadline or a rejection. It is not the number of
  // times the record was delivered:
  //
  //  - A delivery that ended because its stream did is not an attempt. The
  //    record is sent again under the same number.
  //  - The count is kept in the memory of the replica that owns the
  //    partition and starts again at 1 when the partition changes owner: a
  //    hand-over to another replica, a replica that restarts, a topic taken
  //    up again after nobody had declared it for the idle grace, or declared
  //    with other settings.
  //
  // So a value above 1 means an earlier attempt failed and an application
  // may have seen the record, and 1 promises nothing: the record may have
  // been delivered before, any number of times. Settings.max_attempts
  // counts the same way.
  uint32 attempt = 6;
}

// Released tells the sidecar that the dispatcher replica no longer owns the
// listed partitions. The sidecar drops every record of them it holds
// unacknowledged: the new owner delivers them again, and an acknowledgement
// sent to this replica for them is ignored.
message Released {
  // The partitions the replica gave up.
  repeated int32 partitions = 1;
}
