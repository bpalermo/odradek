edition = "2024";

// The configuration schema of the Odradek server.
//
// The server reads one file in this schema from a mounted volume, watches it
// and applies changes without restarting. Constraints are declared with
// protovalidate; a file that violates any of them is rejected as a whole and
// the server keeps its last valid configuration.
package odradek.config.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_outer_classname = "ConfigProto";
option java_package = "io.github.bpalermo.odradek.config.v1";

// ServerConfig is the root of the server configuration file.
//
// The file is YAML or JSON in the protobuf JSON mapping (field names in
// lowerCamelCase, durations as strings such as "30s"). It is parsed strictly:
// an unknown field is an error. Unset fields mean "use the documented
// default" unless stated otherwise.
message ServerConfig {
  option (buf.validate.message).cel = {
    id: "server_config.producer_clusters_exist"
    message: "every producer must reference entries in clusters"
    expression: "this.producers.all(topic, this.producers[topic].clusters.all(t, t.cluster in this.clusters))"
  };
  // 2 is CONSUMER_SOURCE_DISPATCHER, here and below. The dispatcher resolves
  // the cluster name of such a consumer.
  option (buf.validate.message).cel = {
    id: "server_config.consumer_cluster_exists"
    message: "every consumer that reads Kafka itself must reference an entry in clusters"
    expression: "this.consumers.all(topic, this.consumers[topic].source == 2 || this.consumers[topic].cluster in this.clusters)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.clusters_required"
    message: "at least one cluster is required, unless a consumer receives from the dispatcher"
    expression: "size(this.clusters) > 0 || this.consumers.exists(topic, this.consumers[topic].source == 2)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.dispatcher_required"
    message: "dispatcher must be set when a consumer's source is CONSUMER_SOURCE_DISPATCHER"
    expression: "has(this.dispatcher) || this.consumers.all(topic, this.consumers[topic].source != 2)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.dead_letter_topic_differs"
    message: "a consumer's dead_letter_topic must not be the topic it consumes"
    expression: "this.consumers.all(topic, this.consumers[topic].dead_letter_topic != topic)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.policy_clusters_exist"
    message: "every rule of dispatch.policy must reference an entry in clusters"
    expression: "this.dispatch.policy.all(rule, rule.cluster in this.clusters)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.coordination_cluster_exists"
    message: "dispatch.coordination.cluster must reference an entry in clusters, and must be set when there are several"
    expression: "!has(this.dispatch) || (this.dispatch.coordination.cluster != '' ? this.dispatch.coordination.cluster in this.clusters : size(this.clusters) == 1)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.default_codec_exists"
    message: "default_codec must be passthrough or reference an entry in codecs"
    expression: "this.default_codec == '' || this.default_codec == 'passthrough' || this.default_codec in this.codecs"
  };
  option (buf.validate.message).cel = {
    id: "server_config.producer_codec_exists"
    message: "a producer's codec must be passthrough or reference an entry in codecs"
    expression: "this.producers.all(topic, this.producers[topic].codec == '' || this.producers[topic].codec == 'passthrough' || this.producers[topic].codec in this.codecs)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.consumer_codec_exists"
    message: "a consumer's codec must be passthrough or reference an entry in codecs"
    expression: "this.consumers.all(topic, this.consumers[topic].codec == '' || this.consumers[topic].codec == 'passthrough' || this.consumers[topic].codec in this.codecs)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.passthrough_reserved"
    message: "passthrough is a built-in codec and cannot be defined in codecs"
    expression: "!('passthrough' in this.codecs)"
  };
  option (buf.validate.message).cel = {
    id: "server_config.contract_types_match"
    message: "a topic that is both produced and consumed must declare the same key_type and value_type in both entries"
    expression: "this.producers.all(topic, !(topic in this.consumers) || (this.producers[topic].value_type == this.consumers[topic].value_type && this.producers[topic].key_type == this.consumers[topic].key_type))"
  };
  option (buf.validate.message).cel = {
    id: "server_config.contracts_required"
    message: "contracts.descriptor_sets must be set when any topic declares key_type or value_type"
    expression: "size(this.contracts.descriptor_sets) > 0 || (this.producers.all(topic, this.producers[topic].value_type == '' && this.producers[topic].key_type == '') && this.consumers.all(topic, this.consumers[topic].value_type == '' && this.consumers[topic].key_type == ''))"
  };

  // Where the app-facing gRPC server listens. Not hot-reloadable: a change
  // takes effect at the next server restart.
  Listener listener = 1;
  // The health service for kubelet probes. Not hot-reloadable: a change
  // takes effect at the next server restart.
  Admin admin = 2;

  reserved 3;

  // Kafka clusters by name. The name is what `producers` and `consumers`
  // entries and the rules of `dispatch.policy` reference; apps never see it
  // as a parameter. Names are lowercase alphanumerics and dashes, at most 63
  // characters. At least one cluster is required, except in a server that
  // receives what it consumes from a dispatcher and produces nothing: it
  // talks to no broker.
  map<string, Cluster> clusters = 4 [(buf.validate.field).map.keys.string.pattern = "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"];

  // Settings for the produce path, shared by all clusters.
  Produce produce = 5;
  // Settings for the consume path, shared by all consumers.
  Consume consume = 6;

  // Consumers by topic name. An app subscribes to topics (Subscribe.topics);
  // the cluster and consumer group for each topic come from here, never from
  // the app. A topic without an entry cannot be consumed.
  map<string, Consumer> consumers = 7 [(buf.validate.field).map.keys.string.pattern = "^[a-zA-Z0-9._-]{1,249}$"];

  // Producers by topic name. Each entry lists the cluster or clusters a
  // topic is produced to. A topic without an entry cannot be produced to:
  // the record is rejected with ERROR_CODE_TOPIC_NOT_CONFIGURED.
  map<string, Producer> producers = 8 [(buf.validate.field).map.keys.string.pattern = "^[a-zA-Z0-9._-]{1,249}$"];

  // Where the protobuf message types named by `key_type` and `value_type`
  // are found.
  Contracts contracts = 9;

  // Name of the codec used by every topic whose entry does not set `codec`:
  // an entry in `codecs`, or the built-in `passthrough`. Unset is the same
  // as `passthrough`: bytes are stored as the app sent them.
  string default_codec = 10;

  // Codecs by name. A codec says how records are stored in Kafka: the
  // serialization format and any transforms such as encryption. Names follow
  // the rules of cluster names; `passthrough` is reserved for the built-in
  // codec.
  map<string, Codec> codecs = 11 [(buf.validate.field).map.keys.string.pattern = "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"];

  // Absolute path of a directory of jar files holding the serializer,
  // deserializer and transform classes that codecs name. Read once at
  // startup; not hot-reloadable. Unset means only classes shipped with the
  // server are available.
  string extensions_dir = 12 [(buf.validate.field).string.prefix = "/"];

  // Where the server's metrics are pushed. Not hot-reloadable. Unset means
  // no metrics are exported.
  Telemetry telemetry = 13;

  // Makes this server a dispatcher: it joins the consumer groups that
  // sidecars declare and hands them the records, instead of each
  // application pod consuming for itself. Unset means the server dispatches
  // nothing. One server may be a dispatcher and serve an app at the same
  // time.
  Dispatch dispatch = 14;

  // The dispatcher that the consumers whose `source` is
  // CONSUMER_SOURCE_DISPATCHER receive their records from. Required when
  // there is such a consumer; unused otherwise.
  Dispatcher dispatcher = 15;
}

// Dispatch configures a dispatcher: a server deployed on its own, whose
// replicas are the consumer group, and which delivers the records it consumes
// to the sidecars that connect to it.
//
// A dispatcher has no list of topics. It consumes what the connected sidecars
// declare, on the clusters of ServerConfig.clusters, as far as `policy`
// allows.
message Dispatch {
  option (buf.validate.message).cel = {
    id: "dispatch.policy_requires_tls"
    message: "a policy needs tls: without it no sidecar has an identity a rule could match"
    expression: "size(this.policy) == 0 || has(this.tls)"
  };

  // TCP port on which sidecars connect (odradek.delivery.v1.DeliveryService).
  // Default: 9465. 0 picks a free port, which the server logs. Not
  // hot-reloadable: a change takes effect at the next server restart.
  uint32 port = 1 [(buf.validate.field).uint32.lte = 65535];
  // The address, as host:port, at which sidecars reach this replica. The
  // other replicas hand it to every sidecar, which connects to it as given,
  // so it must be this replica's own address and not that of a Service in
  // front of all of them. It is therefore different in every replica: set it
  // only in a configuration that one replica reads, which is to say in tests.
  // Replicas that share a configuration file leave it unset and, when the
  // default is not the address sidecars can reach, are each given their host
  // in the environment variable ODRADEK_ADVERTISED_HOST (in Kubernetes, from
  // the pod's `status.podIP`), to which the port being served is added.
  // Setting both is an error. Default: the address of the pod's network
  // interface, with the port being served. Not hot-reloadable.
  string advertised_address = 2 [(buf.validate.field).string.host_and_port = true];
  // How long the dispatcher keeps consuming a topic after the last sidecar
  // that declared it has gone. It keeps a rollout of the application, during
  // which every sidecar disconnects once, from making the dispatcher leave
  // the group and join it again. Zero stops at once. Default: 5m.
  google.protobuf.Duration idle_grace = 3 [(buf.validate.field).duration.gte = {}];
  // The largest span, in offsets, between a partition's commit position and
  // the newest record delivered from it. A partition that reaches it is
  // paused until its oldest unacknowledged record is acknowledged. It bounds
  // the memory held per partition and how much is delivered again after a
  // dispatcher restart. At least 1. Default: 1000.
  uint32 partition_window = 4 [(buf.validate.field).uint32.gte = 1];
  // Who may consume what. A declaration is accepted when at least one rule
  // allows it; with `tls` and no rule, every declaration is refused. A rule
  // that is too wide gives an application topics it should not read: the
  // dispatcher reads Kafka as itself, so the brokers' ACLs cannot tell its
  // applications apart.
  //
  // A rule matches a sidecar by the SPIFFE ID of its client certificate, so
  // a policy needs `tls`: a configuration with rules and no `tls` is
  // rejected. A declaration is checked when it is made, and a stream that
  // was accepted stays until it ends. Not hot-reloadable.
  repeated PolicyRule policy = 5;
  // Mutual TLS on the delivery port: the certificate this dispatcher presents
  // to sidecars and the authorities their certificates must chain to. A
  // connection without a client certificate, or with one that does not
  // verify, is closed during the handshake. Rotated credentials are used
  // from the next handshake on; connections that are open keep theirs.
  //
  // Unset, the port is PLAINTEXT and unauthenticated: there is no identity
  // to check, `policy` must be empty, and every declaration that names one
  // of this dispatcher's clusters is accepted, so whoever reaches the port
  // reads every topic the dispatcher's Kafka credentials can. That is for
  // tests and for a machine nobody else can reach, and the server says so
  // loudly every time it starts. Not hot-reloadable.
  ListenerTls tls = 6;
  // How the replicas of this dispatcher find each other. Required.
  Coordination coordination = 7 [(buf.validate.field).required = true];
}

// Coordination names the Kafka consumer group through which the replicas of
// one dispatcher find each other. Every replica joins it when it starts and
// attaches the address it advertises; the group's membership is the list of
// replicas that every sidecar is sent, and it changes when a replica starts
// or stops. The group consumes nothing, subscribes to no topic and commits no
// offset. It uses Kafka's classic group protocol whatever the cluster's
// properties say, because the addresses travel through a client-side
// assignor.
//
// Whoever can join this group can add an address to the list sidecars are
// sent. On a cluster with ACLs, allow only the dispatcher's principal to
// read the group; and have sidecars accept the dispatcher by SPIFFE ID
// (Tls.accepted_spiffe_ids under Dispatcher.tls) rather than by trust
// domain, so that an address added by anybody else is connected to and then
// refused.
message Coordination {
  // Name of an entry in ServerConfig.clusters: the cluster the group lives
  // on. Every replica must name the same one. May be left unset when there is
  // exactly one cluster. Not hot-reloadable; changing it with a rolling
  // update splits the replicas into two lists until the update is complete.
  string cluster = 1;
  // The consumer group. It must be this dispatcher's alone: two dispatcher
  // deployments that shared a group on one cluster would hand their sidecars
  // each other's replicas. Required. Not hot-reloadable; changing it splits
  // the replicas as changing `cluster` does.
  string group_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// ListenerTls configures the credentials of a port the server listens on
// with mutual TLS. Which peers are accepted is not said here: every peer
// whose certificate verifies completes the handshake, and what it may do is
// decided by its identity afterwards (Dispatch.policy).
message ListenerTls {
  // Where the server certificate, private key and trust bundle come from.
  // Exactly one must be set.
  //
  // With `spiffe`, a client certificate must carry a SPIFFE ID and chain to
  // the bundle of the trust domain that ID names, so that an authority
  // federated with can only vouch for its own identities. With `files`, it
  // must chain to the CA bundle; one that carries no SPIFFE ID completes the
  // handshake and is then refused everything, as UNAUTHENTICATED.
  oneof source {
    option (buf.validate.oneof).required = true;

    // Take X.509 SVIDs and bundles from the SPIFFE Workload API.
    SpiffeSource spiffe = 1;
    // Take PEM files from a watched directory.
    FileSource files = 2;
  }
}

// PolicyRule allows some sidecars to consume some topics of one cluster in
// some consumer groups. It allows a declaration when the sidecar's identity,
// the cluster, the topic and the group all match, and, for a declaration
// that names a dead-letter topic, that topic too.
//
// A topic or group pattern is either an exact name or a prefix followed by
// one `*`, which stands for any characters, including none: `orders.*`
// matches `orders.created` and `orders.`, and `*` alone matches every name.
// There is no other wildcard, and `*` anywhere but at the end is rejected.
message PolicyRule {
  option (buf.validate.message).cel = {
    id: "policy_rule.identity_required"
    message: "a rule needs spiffe_ids or trust_domain"
    expression: "size(this.spiffe_ids) > 0 || this.trust_domain != ''"
  };

  // SPIFFE IDs of the sidecars the rule applies to, e.g.
  // "spiffe://example.org/ns/billing/sa/billing". At least one of spiffe_ids
  // and trust_domain is required: a rule cannot apply to everybody.
  repeated string spiffe_ids = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {prefix: "spiffe://"}
    }
  }];
  // The rule also applies to every sidecar whose SPIFFE ID is in this trust
  // domain, given without scheme (e.g. "example.org").
  string trust_domain = 2 [(buf.validate.field).string.pattern = "^[a-z0-9._-]{1,255}$"];
  // Name of an entry in ServerConfig.clusters: the cluster the rule lets
  // these sidecars consume from. Required.
  string cluster = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Patterns of the topics the rule allows. At least one is required.
  repeated string topics = 4 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {pattern: "^([a-zA-Z0-9._-]{1,249}|[a-zA-Z0-9._-]{0,248}\\*)$"}
    }
  }];
  // Patterns of the consumer groups the rule allows. At least one is
  // required. A group is the unit that shares offsets, so two applications
  // allowed the same group and topic take records from each other.
  repeated string groups = 5 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {pattern: "^([^*]+|[^*]*\\*)$"}
    }
  }];
  // Patterns of the topics that a declaration allowed by this rule may name
  // as its dead-letter topic. The dispatcher writes exhausted records there
  // as itself, so this is what stops a sidecar from having it write to a
  // topic of the sidecar's choosing. Empty means the rule allows no
  // dead-letter topic.
  repeated string dead_letter_topics = 6 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {pattern: "^([a-zA-Z0-9._-]{1,249}|[a-zA-Z0-9._-]{0,248}\\*)$"}
    }
  }];
}

// Dispatcher says where the dispatcher is, for a server that receives topics
// from one.
message Dispatcher {
  option (buf.validate.message).cel = {
    id: "dispatcher.tls_peer_identity"
    message: "tls needs accepted_spiffe_ids or accepted_trust_domain: a dispatcher is recognized by its SPIFFE ID, never by host name"
    expression: "!has(this.tls) || size(this.tls.accepted_spiffe_ids) > 0 || this.tls.accepted_trust_domain != ''"
  };

  // The address of the dispatcher's Service, as host:port (e.g.
  // "odradek-dispatcher.kafka.svc:9465"). It is used for the first
  // connection only, and again after every connection has been lost: the
  // replica that answers lists all replicas, and the server then connects to
  // each of them directly. Required.
  string address = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.host_and_port = true
  ];
  // Mutual TLS to the dispatcher: the client certificate this server
  // presents, whose SPIFFE ID is what the dispatcher's policy is matched
  // against, the authorities a dispatcher's certificate must chain to, and
  // the dispatcher's identity. Rotated credentials are used from the next
  // connection on.
  //
  // accepted_spiffe_ids or accepted_trust_domain is required, whatever the
  // source: every replica must present a SPIFFE ID they accept. The host
  // name is never checked, because replicas are connected to by IP address.
  //
  // Unset, the connection is PLAINTEXT: records and acknowledgements travel
  // unencrypted, and nothing proves that what answers at `address` is the
  // dispatcher. That is for tests, and the server says so loudly every time
  // it starts. A dispatcher with `tls` does not answer such a server. Not
  // hot-reloadable.
  Tls tls = 2;
}

// Telemetry configures the export of the server's metrics over OTLP/gRPC.
message Telemetry {
  // The OTLP/gRPC endpoint of a collector, as http://host:port or
  // https://host:port (4317 is the usual port). https verifies the collector
  // against the JVM's default trust store. Unset means nothing is exported.
  string endpoint = 1 [(buf.validate.field).string.pattern = "^https?://[^/:]+:[0-9]{1,5}/?$"];
  // How often metrics are pushed. Default: 30s. At least 1s.
  google.protobuf.Duration export_interval = 2 [(buf.validate.field).duration.gte = {seconds: 1}];
  // Resource attributes added to every metric, next to service.name, which
  // is "odradek" unless set here (e.g. k8s.pod.name, deployment.environment).
  map<string, string> resource_attributes = 3 [(buf.validate.field).map.keys.string.min_len = 1];
}

// Contracts lists the schemas of the messages apps exchange with the server.
message Contracts {
  // Absolute paths of files holding a serialized
  // google.protobuf.FileDescriptorSet (for example the output of
  // `buf build -o contracts.binpb`). Each set must contain the files it
  // imports, or another listed set must. A message type may be defined only
  // once across all sets.
  repeated string descriptor_sets = 1 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.prefix = "/"
  ];
}

// Codec is the pipeline between the bytes an app exchanges with the server
// and the bytes stored in Kafka, for record keys and for record values.
message Codec {
  // How record keys are stored. Unset stores them unchanged. Kafka
  // partitions and compacts by the stored key, so a key pipeline must be
  // deterministic: equal keys must produce equal bytes.
  Pipeline key = 1;
  // How record values are stored. Unset stores them unchanged.
  Pipeline value = 2;
}

// Pipeline is the chain applied to one side of a record (key or value). On
// produce the serializer runs first, then the transforms in order. On
// consume the transforms run in reverse order, then the deserializer. A null
// key or value is never passed through the pipeline.
message Pipeline {
  option (buf.validate.message).cel = {
    id: "pipeline.serializer_pair"
    message: "serializer and deserializer must be set together"
    expression: "(this.serializer == '') == (this.deserializer == '')"
  };

  // Fully qualified name of a class implementing
  // org.apache.kafka.common.serialization.Serializer. It receives a
  // com.google.protobuf.Message when the topic declares a contract type and
  // the class does not declare that it takes byte[]; otherwise the bytes the
  // app sent. Unset stores the app's bytes as they are.
  string serializer = 1 [(buf.validate.field).string.pattern = "^[A-Za-z_$][A-Za-z0-9_$]*(\\.[A-Za-z_$][A-Za-z0-9_$]*)*$"];
  // Fully qualified name of a class implementing
  // org.apache.kafka.common.serialization.Deserializer. It must return a
  // com.google.protobuf.Message or a byte[]. Required when serializer is
  // set.
  string deserializer = 2 [(buf.validate.field).string.pattern = "^[A-Za-z_$][A-Za-z0-9_$]*(\\.[A-Za-z_$][A-Za-z0-9_$]*)*$"];
  // Passed to the serializer's and the deserializer's configure(), as the
  // Kafka client passes its own configuration.
  map<string, string> properties = 3;
  // Byte-to-byte steps applied to the serialized form, such as encryption.
  repeated Transform transforms = 4;
}

// Transform is one byte-to-byte step of a Pipeline.
message Transform {
  // Fully qualified name of a class implementing
  // io.github.bpalermo.odradek.extension.RecordTransform. Written as `class`
  // in the configuration file. Required.
  string class_name = 1 [
    json_name = "class",
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z_$][A-Za-z0-9_$]*(\\.[A-Za-z_$][A-Za-z0-9_$]*)*$"
  ];
  // Passed to the transform's configure().
  map<string, string> properties = 2;
}

// Producer says which clusters a topic is produced to. With more than one
// cluster every record is written to all of them, with the same key, value,
// headers and timestamp. This can be a permanent arrangement or a stage of
// moving a topic between clusters. Offsets, and the relative order of records
// from different producers, are not the same across clusters.
message Producer {
  option (buf.validate.message).cel = {
    id: "producer.clusters_unique"
    message: "a cluster may be listed only once"
    expression: "this.clusters.map(t, t.cluster).unique()"
  };
  option (buf.validate.message).cel = {
    id: "producer.one_required_cluster"
    message: "at least one cluster must not be best_effort"
    expression: "this.clusters.exists(t, !t.best_effort)"
  };

  // The clusters to write to. All are equal peers; the order only determines
  // the order of ProduceResult.writes. At least one is required.
  repeated ProduceTarget clusters = 1 [(buf.validate.field).repeated.min_items = 1];

  // Name of the codec that stores this topic: an entry in
  // ServerConfig.codecs, or `passthrough`. Unset uses
  // ServerConfig.default_codec. The codec replaces the default as a whole;
  // nothing is merged.
  string codec = 2;
  // Fully qualified protobuf message type the app exchanges as the record
  // value, found in ServerConfig.contracts. Unset means the value is opaque
  // bytes. A topic present in both `producers` and `consumers` must declare
  // the same type in both.
  string value_type = 3 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"];
  // Fully qualified protobuf message type the app exchanges as the record
  // key. Unset means the key is opaque bytes. See value_type.
  string key_type = 4 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"];
}

// ProduceTarget is one cluster a topic is produced to.
message ProduceTarget {
  // Name of an entry in ServerConfig.clusters. The topic must already exist
  // there. Required.
  string cluster = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Whether the write to this cluster is best effort. A record is reported
  // as produced once every cluster that is not best effort acknowledged it;
  // a failure on a best-effort cluster is only counted in metrics. Such a
  // cluster may miss records, so do not consume from it expecting
  // completeness. Default: false.
  bool best_effort = 2;
}

// Consumer says where and as whom one topic is consumed. It is the value of
// ServerConfig.consumers, keyed by topic name.
message Consumer {
  // 2 is CONSUMER_SOURCE_DISPATCHER.
  option (buf.validate.message).cel = {
    id: "consumer.dispatcher_settings"
    message: "ordering, max_attempts, on_exhausted and dead_letter_topic need source CONSUMER_SOURCE_DISPATCHER"
    expression: "this.source == 2 || (!has(this.ordering) && !has(this.max_attempts) && !has(this.on_exhausted) && !has(this.dead_letter_topic))"
  };
  option (buf.validate.message).cel = {
    id: "consumer.on_exhausted_needs_max_attempts"
    message: "on_exhausted has no effect without max_attempts"
    expression: "!has(this.on_exhausted) || has(this.max_attempts)"
  };
  // 2 is ON_EXHAUSTED_DEAD_LETTER.
  option (buf.validate.message).cel = {
    id: "consumer.dead_letter_topic"
    message: "dead_letter_topic must be set when on_exhausted is ON_EXHAUSTED_DEAD_LETTER, and only then"
    expression: "(this.on_exhausted == 2) == has(this.dead_letter_topic)"
  };

  // The cluster to read the topic from. When this server reads Kafka itself
  // it is the name of an entry in ServerConfig.clusters. When `source` is
  // CONSUMER_SOURCE_DISPATCHER it is the name of a cluster in the
  // dispatcher's configuration, and need not exist in this one.
  // Required; there is no default cluster for consuming.
  string cluster = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Consumer group used to read this topic. Topics that an app subscribes to
  // on one stream must share the same cluster, group and `source`. Required.
  string group_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Where to start reading a partition for which the group has no committed
  // offset on `cluster`: at the first record whose timestamp is at or after
  // this instant. Takes precedence over offset_reset. Intended for moving a
  // consumer to another cluster the topic is also produced to, where a
  // record carries the same timestamp on every cluster. Ignored once the group has
  // committed an offset. In the file it is an RFC 3339 string, e.g.
  // "2026-10-12T10:00:00Z".
  google.protobuf.Timestamp start_timestamp = 3;
  // Where to start reading a partition for which the group has no committed
  // offset and start_timestamp is unset or matches no record.
  // Default: OFFSET_RESET_EARLIEST.
  OffsetReset offset_reset = 4 [(buf.validate.field).enum.defined_only = true];

  // Name of the codec that stores this topic: an entry in
  // ServerConfig.codecs, or `passthrough`. Unset uses
  // ServerConfig.default_codec. The codec replaces the default as a whole;
  // nothing is merged.
  string codec = 5;
  // Fully qualified protobuf message type the app exchanges as the record
  // value, found in ServerConfig.contracts. Unset means the value is opaque
  // bytes. A topic present in both `producers` and `consumers` must declare
  // the same type in both.
  string value_type = 6 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"];
  // Fully qualified protobuf message type the app exchanges as the record
  // key. Unset means the key is opaque bytes. See value_type.
  string key_type = 7 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"];
  // What happens to a record that the codec cannot decode.
  // Default: ON_DECODE_ERROR_FAIL.
  OnDecodeError on_decode_error = 8 [(buf.validate.field).enum.defined_only = true];

  // Who reads the topic from Kafka: this server, or a dispatcher that hands
  // it the records. Default: CONSUMER_SOURCE_KAFKA.
  ConsumerSource source = 9 [(buf.validate.field).enum.defined_only = true];
  // Which records of the topic may be with applications at the same time,
  // now that a partition is no longer read by one process. Every server of
  // the group must say the same. Only with CONSUMER_SOURCE_DISPATCHER.
  // Default: ORDERING_KEY.
  Ordering ordering = 10 [(buf.validate.field).enum.defined_only = true];
  // How many times a record is delivered before it is given up on, as
  // on_exhausted says. A delivery fails when the app does not acknowledge
  // the record within the processing deadline, or when the record cannot be
  // decoded. A record delivered again because the app's stream ended has not
  // used one up. At least 1. Unset means there is no limit: the record is
  // delivered again until it is acknowledged. Only with
  // CONSUMER_SOURCE_DISPATCHER.
  uint32 max_attempts = 11 [(buf.validate.field).uint32.gte = 1];
  // What happens to a record that has been delivered max_attempts times
  // without being acknowledged. Needs max_attempts. Only with
  // CONSUMER_SOURCE_DISPATCHER. Default: ON_EXHAUSTED_BLOCK.
  OnExhausted on_exhausted = 12 [(buf.validate.field).enum.defined_only = true];
  // Topic, on the same cluster, that the dispatcher writes exhausted records
  // to. It must already exist, the dispatcher's policy must allow it, and it
  // cannot be the topic itself. Required with ON_EXHAUSTED_DEAD_LETTER and
  // rejected otherwise.
  string dead_letter_topic = 13 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9._-]{1,249}$"];
}

// ConsumerSource says who reads a topic from Kafka on behalf of the app.
enum ConsumerSource {
  // Not set; behaves as CONSUMER_SOURCE_KAFKA.
  CONSUMER_SOURCE_UNSPECIFIED = 0;
  // This server holds the Kafka consumer, so the application's pods are the
  // members of the consumer group.
  CONSUMER_SOURCE_KAFKA = 1;
  // A dispatcher holds the Kafka consumer and delivers the records to this
  // server, which decodes them and hands them to the app. The application's
  // pods are not group members: scaling them rebalances nothing, and there
  // can be more of them than the topic has partitions.
  CONSUMER_SOURCE_DISPATCHER = 2;
}

// Ordering says which records of a topic received from a dispatcher may be
// with applications at the same time. Order holds only while nothing is
// delivered again: a record whose processing deadline passes is given to
// another pod, and both may then process it.
enum Ordering {
  // Not set; behaves as ORDERING_KEY.
  ORDERING_UNSPECIFIED = 0;
  // A record is delivered only once every earlier record of its partition
  // with the same key is acknowledged. Records of different keys are
  // processed in parallel, by more pods than there are partitions if need
  // be. Records without a key are delivered as under ORDERING_NONE. Keys are
  // compared as stored in Kafka, so a codec that stores equal keys as
  // different bytes cannot be used.
  ORDERING_KEY = 1;
  // A record is delivered only once every earlier record of its partition
  // is acknowledged: one record at a time per partition.
  ORDERING_PARTITION = 2;
  // A record is delivered as soon as an application has asked for one. No
  // order is kept.
  ORDERING_NONE = 3;
}

// OnExhausted is the handling of a record that was delivered
// Consumer.max_attempts times without being acknowledged.
enum OnExhausted {
  // Not set; behaves as ON_EXHAUSTED_BLOCK.
  ON_EXHAUSTED_UNSPECIFIED = 0;
  // The record blocks its partition: it is not skipped, nothing is committed
  // past it and no later record of the partition is delivered. Nothing is
  // lost, and the partition's lag grows until someone intervenes.
  ON_EXHAUSTED_BLOCK = 1;
  // The dispatcher writes the record, as stored, to
  // Consumer.dead_letter_topic and moves on. The app never processes it.
  ON_EXHAUSTED_DEAD_LETTER = 2;
}

// OnDecodeError is the handling of a consumed record whose key or value the
// topic's codec cannot turn back into what the app expects.
enum OnDecodeError {
  // Not set; behaves as ON_DECODE_ERROR_FAIL.
  ON_DECODE_ERROR_UNSPECIFIED = 0;
  // End the Consume stream with DATA_LOSS. The offset is not committed, so
  // the record is met again after resubscribing, until the codec or the
  // record's source is fixed. Nothing is skipped.
  //
  // For a topic received from a dispatcher the stream stays open: the record
  // is rejected back to the dispatcher, which counts a failed delivery and
  // delivers it again (see Consumer.max_attempts). The app never sees it.
  ON_DECODE_ERROR_FAIL = 1;
  // Deliver the record as stored, with ConsumedRecord.decode_error set. The
  // app acks it like any other record and decides what to do with it.
  ON_DECODE_ERROR_DELIVER_UNDECODED = 2;
}

// OffsetReset is the position used for a partition without a committed
// offset. The server applies it itself; the Kafka property
// auto.offset.reset must not be set.
enum OffsetReset {
  // Not set; behaves as OFFSET_RESET_EARLIEST.
  OFFSET_RESET_UNSPECIFIED = 0;
  // Start at the oldest retained record. Never skips records; may re-read
  // ones already processed elsewhere.
  OFFSET_RESET_EARLIEST = 1;
  // Start at the end of the partition. Records written before the consumer
  // first joins are skipped.
  OFFSET_RESET_LATEST = 2;
}

// Listener configures the Unix domain socket the app connects to.
message Listener {
  // Absolute path of the Unix domain socket the gRPC server binds. The
  // directory must be a volume shared with the app container.
  // Default: /var/run/kafka/kafka.sock.
  string socket_path = 1 [(buf.validate.field).string.prefix = "/"];
  // Peer user IDs (from SO_PEERCRED) allowed to connect. A peer is accepted
  // if its UID is listed here or its GID is listed in allowed_gids. When both
  // lists are empty, any peer that can open the socket is accepted.
  repeated uint32 allowed_uids = 2 [(buf.validate.field).repeated.unique = true];
  // Peer group IDs (from SO_PEERCRED) allowed to connect. See allowed_uids.
  repeated uint32 allowed_gids = 3 [(buf.validate.field).repeated.unique = true];
}

// Admin configures the TCP port kubelet probes. It serves the standard gRPC
// health service (grpc.health.v1.Health/Check) and nothing else: service ""
// is SERVING once the server is listening with usable TLS credentials and
// NOT_SERVING otherwise; service "liveness" is SERVING while the process runs.
// The same service is offered to the app on the listener's Unix socket.
message Admin {
  // TCP port of the health service. Default: 9464. 0 picks a free port, which
  // the server logs.
  uint32 port = 1 [(buf.validate.field).uint32.lte = 65535];
}

// Cluster describes one Kafka cluster and how to connect to it.
//
// The effective producer properties are `properties` overlaid with
// `producer_properties`; the effective consumer properties are `properties`
// overlaid with `consumer_properties`.
message Cluster {
  option (buf.validate.message).cel = {
    id: "cluster.bootstrap_servers"
    message: "properties must set bootstrap.servers"
    expression: "'bootstrap.servers' in this.properties && this.properties['bootstrap.servers'] != ''"
  };
  // The settings below are what the delivery guarantees rest on. They may be
  // omitted (the server sets them) but never set to a weaker value.
  option (buf.validate.message).cel = {
    id: "cluster.acks_all"
    message: "acks must be all"
    expression: "[this.properties, this.producer_properties].all(m, !('acks' in m) || m['acks'] in ['all', '-1'])"
  };
  option (buf.validate.message).cel = {
    id: "cluster.idempotence_enabled"
    message: "enable.idempotence must be true"
    expression: "[this.properties, this.producer_properties].all(m, !('enable.idempotence' in m) || m['enable.idempotence'] == 'true')"
  };
  option (buf.validate.message).cel = {
    id: "cluster.max_in_flight"
    message: "max.in.flight.requests.per.connection must be between 1 and 5"
    expression: "[this.properties, this.producer_properties].all(m, !('max.in.flight.requests.per.connection' in m) || m['max.in.flight.requests.per.connection'].matches('^[1-5]$'))"
  };
  option (buf.validate.message).cel = {
    id: "cluster.auto_commit_disabled"
    message: "enable.auto.commit must be false"
    expression: "[this.properties, this.consumer_properties].all(m, !('enable.auto.commit' in m) || m['enable.auto.commit'] == 'false')"
  };
  // The starting position is set per topic in Consumer, not per cluster.
  option (buf.validate.message).cel = {
    id: "cluster.offset_reset_owned_by_server"
    message: "auto.offset.reset must not be set; use consumers.<topic>.offset_reset"
    expression: "[this.properties, this.consumer_properties].all(m, !('auto.offset.reset' in m))"
  };
  // TLS material is owned by the server's engine factory, never by Kafka's
  // keystore settings, so that rotation does not rebuild clients.
  option (buf.validate.message).cel = {
    id: "cluster.tls_owned_by_server"
    message: "ssl.engine.factory.class, ssl.keystore.* and ssl.truststore.* must not be set; use tls"
    expression: "[this.properties, this.producer_properties, this.consumer_properties].all(m, m.all(k, k != 'ssl.engine.factory.class' && !k.startsWith('ssl.keystore.') && !k.startsWith('ssl.truststore.')))"
  };

  // Whether the server must reach this cluster before it starts. At startup
  // the server asks every required cluster for its metadata, with the shared
  // `properties` and `tls`, and retries until it answers; until then it does
  // not listen on its socket and the startup probe fails. Optional clusters
  // are not asked: they connect on first use. This gates startup only: a
  // required cluster that becomes unreachable later does not change
  // readiness. Unrelated to ProduceTarget.best_effort. Default: false.
  bool required = 1;

  // Kafka client properties shared by producers and consumers, in the
  // standard Kafka property names (e.g. "bootstrap.servers"). Must set
  // bootstrap.servers. The properties the guarantees depend on (acks,
  // enable.idempotence, max.in.flight.requests.per.connection,
  // enable.auto.commit) may be omitted but not weakened, and ssl.keystore.*,
  // ssl.truststore.* and ssl.engine.factory.class are rejected in favour of
  // `tls`.
  map<string, string> properties = 2 [(buf.validate.field).map.keys.string.min_len = 1];
  // Kafka properties applied to producers only, overriding `properties`.
  // Same restrictions as `properties`.
  map<string, string> producer_properties = 3 [(buf.validate.field).map.keys.string.min_len = 1];
  // Kafka properties applied to consumers only, overriding `properties`.
  // Same restrictions as `properties`.
  map<string, string> consumer_properties = 4 [(buf.validate.field).map.keys.string.min_len = 1];

  // Mutual TLS to the brokers, with credentials that rotate without
  // rebuilding Kafka clients. Unset means the connection security is whatever
  // `properties` configure (e.g. PLAINTEXT or SASL).
  Tls tls = 5;
}

// Tls configures mutual TLS to a peer the server connects to, which is the
// brokers of one cluster (Cluster.tls) or the dispatcher (Dispatcher.tls):
// where the client certificate and trust bundle come from, and which peer
// identities are accepted.
message Tls {
  option (buf.validate.message).cel = {
    id: "tls.spiffe_peer_policy"
    message: "a spiffe source needs accepted_spiffe_ids or accepted_trust_domain"
    expression: "!has(this.spiffe) || size(this.accepted_spiffe_ids) > 0 || this.accepted_trust_domain != ''"
  };

  // Where the client certificate, private key and trust bundle come from.
  // Exactly one must be set.
  oneof source {
    option (buf.validate.oneof).required = true;

    // Take X.509 SVIDs and bundles from the SPIFFE Workload API.
    SpiffeSource spiffe = 1;
    // Take PEM files from a watched directory.
    FileSource files = 2;
  }

  // SPIFFE IDs accepted as peers, e.g.
  // "spiffe://example.org/ns/kafka/sa/broker". A peer certificate whose
  // SPIFFE ID is not listed is rejected, unless accepted_trust_domain covers
  // it. With a `spiffe` source, at least one of accepted_spiffe_ids and
  // accepted_trust_domain is required. With neither, which only Cluster.tls
  // allows, a broker is verified by host name instead.
  repeated string accepted_spiffe_ids = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {prefix: "spiffe://"}
    }
  }];
  // Accept any peer SPIFFE ID in this trust domain, given without scheme
  // (e.g. "example.org").
  string accepted_trust_domain = 4;
}

// SpiffeSource takes X.509 SVIDs and trust bundles from the SPIFFE Workload
// API (typically a SPIRE agent). Rotations are applied in memory; the private
// key is never written to disk.
message SpiffeSource {
  // Workload API address, e.g. unix:///run/spire/agent/sockets/agent.sock.
  // Unset uses the SPIFFE_ENDPOINT_SOCKET environment variable.
  string workload_api_socket = 1 [(buf.validate.field).string.prefix = "unix://"];
}

// FileSource takes PEM-encoded credentials from a directory, typically a
// Secret or CSI volume. The directory is watched and a change is applied
// without rebuilding Kafka clients.
message FileSource {
  // Absolute path of the directory holding the files below. Required.
  string dir = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "/"
  ];
  // Name, inside `dir`, of the PEM certificate chain the server presents,
  // leaf first. Default: tls.crt.
  string cert_file = 2;
  // Name, inside `dir`, of the PEM private key (PKCS#8) matching the leaf
  // certificate. Default: tls.key.
  string key_file = 3;
  // Name, inside `dir`, of the PEM bundle of CA certificates used to verify
  // the peer. Default: ca.crt.
  string ca_file = 4;
}

// Produce tunes the produce path. The values form the flow-control window
// advertised to the app in ProduceReady; a change applies to new streams.
message Produce {
  // Maximum number of records one Produce stream may have awaiting a result.
  // Default: 1000.
  uint32 max_in_flight_records = 1;
  // Maximum bytes (key, value and headers) one Produce stream may have
  // awaiting a result. Keep it below the producer's buffer.memory.
  // Default: 16 MiB.
  uint64 max_in_flight_bytes = 2;
}

// Consume tunes the consume path for all consumers.
message Consume {
  option (buf.validate.message).cel = {
    id: "consume.default_within_max"
    message: "default_max_processing must not exceed max_max_processing"
    expression: "!has(this.default_max_processing) || !has(this.max_max_processing) || this.default_max_processing <= this.max_max_processing"
  };

  // Processing deadline used when the app leaves Subscribe.max_processing_ms
  // at zero: how long a delivered record may stay unacked before the app is
  // considered hung. Must be positive. Default: 5m.
  google.protobuf.Duration default_max_processing = 1 [(buf.validate.field).duration.gt = {}];
  // Upper bound for the processing deadline an app may request; larger
  // requests are clamped to it. Must be positive. Default: 30m.
  google.protobuf.Duration max_max_processing = 2 [(buf.validate.field).duration.gt = {}];
  // How long the server waits for RevokeDone after a Revoked event before it
  // commits and gives the partitions up anyway. Must be positive and well
  // under the group's rebalance timeout. Default: 10s. A dispatcher waits as
  // long for the acknowledgements of the records in flight when it gives
  // partitions up, in a rebalance and when it stops.
  google.protobuf.Duration revoke_deadline = 3 [(buf.validate.field).duration.gt = {}];
  // Interval between asynchronous commits of acked offsets. Must be positive.
  // Default: 5s. A dispatcher commits at the same interval.
  google.protobuf.Duration commit_interval = 4 [(buf.validate.field).duration.gt = {}];
  // Upper bound of the random delay before a consumer is rebuilt after a
  // configuration change, which spreads rebalances across a fleet that
  // receives the change at the same time. Zero disables the delay.
  // Default: 30s.
  google.protobuf.Duration rebuild_jitter = 5 [(buf.validate.field).duration.gte = {}];
}
