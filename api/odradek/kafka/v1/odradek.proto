edition = "2024";

// The app-facing API of Odradek, a server that owns the Kafka clients of an
// application.
//
// An application talks to the server in its own pod instead of linking a
// Kafka client. The server owns the Kafka producers and consumers; this API
// carries records, acknowledgements, flow control and rebalance events
// between the two.
package odradek.kafka.v1;

option java_outer_classname = "OdradekProto";
option java_package = "io.github.bpalermo.odradek.kafka.v1";

// OdradekService is the app-facing API of the Odradek server. It is
// served on a Unix domain socket shared between the app and server
// containers.
//
// Both RPCs are long-lived bidirectional streams. The first message on each
// stream must be the handshake (ProduceOpen / Subscribe); the server answers
// with ProduceReady / Subscribed before anything else. Sending any other
// message first fails the stream with INVALID_ARGUMENT.
service OdradekService {
  // Produce sends records to Kafka.
  //
  // Every ProduceRecord gets exactly one ProduceResult, emitted only after the
  // broker has acknowledged (or definitively failed) the record; the server
  // never acknowledges on enqueue. Records on one stream are handed to the
  // Kafka producer in arrival order, so one stream is one ordering domain.
  //
  // The app does not choose where a record goes: the server configuration
  // maps each topic to one or more Kafka clusters, and a record is written to
  // all of them.
  rpc Produce(stream ProduceRequest) returns (stream ProduceResponse);

  // Consume joins a consumer group and delivers records, assignments and
  // revocations.
  //
  // The app names the topics; the cluster and consumer group for each topic
  // come from the server configuration. Records are delivered only against credits granted
  // by the app, and offsets are committed only for records the app has acked.
  //
  // The stream fails with NOT_FOUND for a topic that is not declared in the
  // configuration, FAILED_PRECONDITION when the requested topics do not share
  // one cluster and group, UNAVAILABLE for a cluster that cannot be reached,
  // and ABORTED when the app exceeds the processing deadline.
  rpc Consume(stream ConsumeRequest) returns (stream ConsumeResponse);
}

// ---------------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------------

// Header is a Kafka record header. Headers are ordered and keys may repeat,
// so they are carried as a list rather than a map.
message Header {
  // Header key.
  string key = 1;
  // Header value. Unset is a null value, which is distinct from an empty one.
  bytes value = 2;
}

// ClientInfo identifies the client library on the other end of a stream. It
// is informational: the server reports it in logs and metrics and never
// changes behaviour because of it.
message ClientInfo {
  // Implementation language of the client library, in lower case: "java",
  // "clojure", "python".
  string language = 1;
  // Version of the client library.
  string version = 2;
}

// TopicPartition identifies one partition of one topic.
message TopicPartition {
  // Topic name.
  string topic = 1;
  // Zero-based partition index.
  int32 partition = 2;
}

// ErrorCode classifies why a record could not be produced. The classification
// tells the app whether a resend is safe, pointless, or may duplicate.
enum ErrorCode {
  // Not set. Never sent by the server.
  ERROR_CODE_UNSPECIFIED = 0;
  // The outcome is unknown: the record may or may not have been written
  // (e.g. delivery.timeout.ms expired, or the server restarted). Also used
  // when the topic is produced to several clusters and not all required ones
  // acknowledged; ProduceResult.writes lists those that did. Resending may
  // duplicate.
  ERROR_CODE_OUTCOME_UNKNOWN = 1;
  // The record was definitively not written and never will be as-is (too
  // large, invalid topic name, ...). Resending unchanged will fail again.
  ERROR_CODE_INVALID_RECORD = 2;
  // The topic or the requested partition does not exist. The record was not
  // written.
  ERROR_CODE_UNKNOWN_TOPIC_OR_PARTITION = 3;
  // The server's identity is not allowed to write to the topic. The record
  // was not written.
  ERROR_CODE_AUTHORIZATION_FAILED = 4;
  // The underlying Kafka client was fenced and must be recreated. The record
  // was not written.
  ERROR_CODE_FENCED = 5;
  // The app violated the protocol (window exceeded, seq went backwards, ...).
  // The record was not sent to Kafka.
  ERROR_CODE_PROTOCOL_VIOLATION = 6;
  // An unexpected failure inside the server. Treat the outcome as unknown.
  ERROR_CODE_INTERNAL = 7;
  // The topic has no entry under `producers` in the server configuration.
  // The record was not sent to Kafka. Only the affected record fails; the
  // stream stays open.
  ERROR_CODE_TOPIC_NOT_CONFIGURED = 8;
}

// Error describes a failed produce.
message Error {
  // Machine-readable classification; drives the app's retry decision.
  ErrorCode code = 1;
  // Human-readable detail for logs. Not stable; do not match on it.
  string message = 2;
  // Simple class name of the originating Kafka exception (e.g.
  // "RecordTooLargeException"), for diagnostics. Empty when the error did not
  // come from the Kafka client.
  string kafka_exception = 3;
}

// ---------------------------------------------------------------------------
// Produce
// ---------------------------------------------------------------------------

// ProduceRequest is a message from the app on a Produce stream.
message ProduceRequest {
  // Exactly one must be set.
  oneof msg {
    // Handshake. Must be the first message on the stream, and sent only once.
    ProduceOpen open = 1;
    // A record to produce. Valid only after ProduceReady has been received.
    ProduceRecord record = 2;
  }
}

// ProduceOpen is the Produce handshake. It binds the stream to a session.
message ProduceOpen {
  // App-chosen identifier, stable for the lifetime of the app process (a
  // random UUID is suitable). `seq` values are scoped to it. Reopening a
  // stream with the same session_id against the same server_epoch resumes
  // deduplication. Required.
  string session_id = 1;
  // The client library sending this stream. Optional.
  ClientInfo client = 2;
}

// ProduceRecord is one record to write to Kafka.
message ProduceRecord {
  // Sequence number, strictly increasing per session, starting at 1. A
  // resend after a stream reconnect reuses the original seq, which is how
  // the server recognizes it as a duplicate.
  uint64 seq = 1;
  // Lowest seq for which the app has not yet received a ProduceResult. The
  // server discards retained results below it. Equal to `seq` when nothing
  // older is outstanding.
  uint64 low_watermark = 2;
  // Destination topic. It must be declared under `producers` in the server
  // configuration, which decides the cluster or clusters it is written to.
  // Required.
  string topic = 3;
  // Destination partition. Unset lets the server's partitioner decide (by
  // key hash when a key is present). When the topic is produced to several
  // clusters an explicit partition is used on all of them and must exist on
  // all.
  int32 partition = 4;
  // Record key. Unset is a null key, which is distinct from an empty one.
  bytes key = 5;
  // Record value. Unset is a null value, i.e. a tombstone on a compacted
  // topic.
  bytes value = 6;
  // Record headers, in order.
  repeated Header headers = 7;
  // Record timestamp in milliseconds since the Unix epoch. Unset uses the
  // server's clock at send time. The same timestamp is written to every
  // cluster the topic is produced to.
  int64 timestamp_ms = 8;
}

// ProduceResponse is a message from the server on a Produce stream.
message ProduceResponse {
  // Exactly one is set.
  oneof msg {
    // Handshake reply. Always the first message on the stream.
    ProduceReady ready = 1;
    // Final outcome of one record.
    ProduceResult result = 2;
  }
}

// ProduceReady completes the Produce handshake and announces the
// flow-control window.
message ProduceReady {
  // Identifier of the running server process. It changes whenever the
  // server restarts. If it differs from the one the app saw before, the
  // server has lost its deduplication state and every record without a
  // result is "outcome unknown".
  string server_epoch = 1;
  // Flow-control window in records: the app must not have more than this
  // many records awaiting a result. Each ProduceResult returns one slot.
  uint32 max_in_flight_records = 2;
  // Flow-control window in bytes, counted over key, value and headers of the
  // records awaiting a result.
  uint64 max_in_flight_bytes = 3;
}

// ProduceResult is the final outcome of one ProduceRecord. Results for
// different partitions may arrive out of seq order; within a partition they
// arrive in order.
message ProduceResult {
  // The seq of the record this result belongs to.
  uint64 seq = 1;
  // Unset on success: every cluster the topic requires acknowledged the
  // record with acks=all. Set when at least one required cluster did not;
  // see Error.code for whether the record may have been written.
  Error error = 2;
  // One entry per cluster that acknowledged the record, in configuration
  // order. On success it has every required cluster, plus any best-effort
  // cluster that had already acknowledged. On error it tells which clusters
  // hold the record anyway.
  repeated RecordMetadata writes = 3;
}

// RecordMetadata says where one cluster wrote an acknowledged record.
// Partition and offset are specific to that cluster.
message RecordMetadata {
  // Name of the cluster, as in the server configuration.
  string cluster = 1;
  // Topic the record was written to.
  string topic = 2;
  // Partition the record was written to.
  int32 partition = 3;
  // Offset assigned by the broker.
  int64 offset = 4;
  // Timestamp stored with the record, in milliseconds since the Unix epoch.
  // May differ from the requested one when the topic uses log-append time.
  int64 timestamp_ms = 5;
}

// ---------------------------------------------------------------------------
// Consume
// ---------------------------------------------------------------------------

// ConsumeRequest is a message from the app on a Consume stream.
message ConsumeRequest {
  // Exactly one must be set.
  oneof msg {
    // Handshake. Must be the first message on the stream, and sent only once.
    Subscribe subscribe = 1;
    // Grants delivery credits.
    Credits credits = 2;
    // Marks records as processed.
    Ack ack = 3;
    // Answers a Revoked event.
    RevokeDone revoke_done = 4;
  }
}

// Subscribe is the Consume handshake. It selects the topics to read; one
// stream is one Kafka consumer, i.e. one member of one consumer group.
message Subscribe {
  // Topics to consume. Each must be declared under `consumers` in the server
  // configuration, which fixes its cluster and consumer group; the app cannot
  // choose them. All topics of one stream must resolve to the same cluster
  // and the same group, and must all be read from Kafka by the server or all
  // be received from a dispatcher; otherwise the stream fails with
  // FAILED_PRECONDITION. At least one is required.
  repeated string topics = 1;
  // Longest the app may hold a delivered record without acking it, in
  // milliseconds. Zero uses the server default; values above the server
  // maximum are clamped. The effective value is returned in Subscribed.
  //
  // When the server reads Kafka itself, it then declares the app hung,
  // leaves the group and fails the stream with ABORTED. When the topics are
  // received from a dispatcher, the dispatcher gives the record to another
  // pod and the stream stays open: the server asks the dispatcher for nothing
  // more until the app has acked every record it has held for longer than
  // this.
  uint32 max_processing_ms = 2;
  // The client library sending this stream. Optional.
  ClientInfo client = 3;
}

// Credits grants the server permission to deliver more records. Grants are
// additive. With no credits left the server pauses fetching but stays in
// the consumer group.
message Credits {
  // Number of additional records the server may deliver.
  uint32 records = 1;
}

// Ack marks the inclusive offset range [first_offset, last_offset] of one
// partition as processed. Acks may arrive out of order; the server commits
// the highest contiguous acked offset.
//
// The range covers the records of it that were delivered on this stream under
// assignment_epoch and are not acked yet, and nothing else. The offsets of
// the delivered records may have gaps (see RecordBatch): an offset in the
// range that was not delivered here is not affected.
message Ack {
  // Topic of the acked records.
  string topic = 1;
  // Partition of the acked records.
  int32 partition = 2;
  // Assignment epoch the records were delivered under, copied from
  // RecordBatch. An ack whose epoch is no longer current is ignored.
  uint64 assignment_epoch = 3;
  // First offset of the range, inclusive.
  int64 first_offset = 4;
  // Last offset of the range, inclusive. Equal to first_offset for a single
  // record.
  int64 last_offset = 5;
}

// RevokeDone tells the server that the app has stopped working on the
// partitions of a Revoked event and has sent its final Acks for them.
message RevokeDone {
  // The revoke_id of the Revoked event being answered.
  uint64 revoke_id = 1;
}

// ConsumeResponse is a message from the server on a Consume stream.
message ConsumeResponse {
  // Exactly one is set.
  oneof msg {
    // Handshake reply. Always the first message on the stream.
    Subscribed subscribed = 1;
    // Partitions were assigned to this consumer.
    Assigned assigned = 2;
    // Partitions are about to be taken away; the app must answer with
    // RevokeDone.
    Revoked revoked = 3;
    // Partitions were taken away without notice.
    Lost lost = 4;
    // Records from one partition.
    RecordBatch records = 5;
  }
}

// Subscribed completes the Consume handshake.
message Subscribed {
  // Identifier of the running server process; see
  // ProduceReady.server_epoch.
  string server_epoch = 1;
  // Effective processing deadline in milliseconds, after defaults and
  // clamping.
  uint32 max_processing_ms = 2;
  // Cluster the topics are read from, as resolved from the configuration.
  // Informational.
  string cluster = 3;
  // Consumer group the server joined, as resolved from the configuration.
  // Informational.
  string group_id = 4;
}

// PartitionAssignment is one partition assigned to this consumer.
message PartitionAssignment {
  // Topic name.
  string topic = 1;
  // Zero-based partition index.
  int32 partition = 2;
  // Identifies this particular ownership of the partition. A new value is
  // issued every time the partition is assigned. Echoed in RecordBatch and
  // required in Ack.
  uint64 assignment_epoch = 3;
}

// Assigned reports newly assigned partitions. With cooperative rebalancing
// it lists only the partitions added, not the full assignment.
//
// For topics received from a dispatcher the app's pod is not a member of the
// consumer group and owns no partition: Assigned then only announces a
// partition before the first records of it, with the epoch they carry, and
// Revoked is never sent. A partition already announced may be announced again
// with a new epoch, after Lost.
message Assigned {
  // The partitions added to this consumer.
  repeated PartitionAssignment partitions = 1;
}

// Revoked asks the app to stop processing the listed partitions. The app
// finishes or abandons in-flight records, sends its final Acks, then
// RevokeDone. After deadline_ms the server proceeds without it; unacked
// records will be redelivered to the next owner.
message Revoked {
  // Identifies this revocation; echo it in RevokeDone.
  uint64 revoke_id = 1;
  // The partitions being taken away.
  repeated TopicPartition partitions = 2;
  // How long the server waits for RevokeDone, in milliseconds.
  uint32 deadline_ms = 3;
}

// Lost reports partitions that were taken away without a chance to commit.
// The app must drop any in-flight work for them; acks will be ignored.
//
// For topics received from a dispatcher it means that the records the app
// holds of those partitions will be delivered again, to this pod or another:
// the dispatcher gave the partitions up, or the connection to it was lost.
message Lost {
  // The partitions that were lost.
  repeated TopicPartition partitions = 1;
}

// RecordBatch carries records from one partition, in offset order. Each
// record consumes one credit.
//
// The offsets need not be consecutive, within a batch or from one batch to
// the next: compaction and transaction markers leave gaps, and for a topic
// received from a dispatcher the records in between went to other pods. For
// such a topic a later batch may also carry a lower offset than an earlier
// one, when a record is delivered again.
message RecordBatch {
  // Topic the records were read from.
  string topic = 1;
  // Partition the records were read from.
  int32 partition = 2;
  // Assignment epoch the records are delivered under; copy it into Ack.
  uint64 assignment_epoch = 3;
  // The records, in offset order.
  repeated ConsumedRecord records = 4;
}

// ConsumedRecord is one record read from Kafka.
message ConsumedRecord {
  // Offset of the record in its partition.
  int64 offset = 1;
  // Record timestamp in milliseconds since the Unix epoch.
  int64 timestamp_ms = 2;
  // Record key. Unset is a null key.
  bytes key = 3;
  // Record value. Unset is a null value (a tombstone).
  bytes value = 4;
  // Record headers, in order.
  repeated Header headers = 5;
  // Set when the topic's codec could not decode the record and the consumer
  // is configured to deliver such records. `key`, `value` and `headers` then
  // hold the record exactly as stored in Kafka, not the form the app
  // normally receives. The text describes the failure and is meant for logs.
  string decode_error = 6;
}
